# git-cliff configuration for yanshi. Run by .github/workflows/release.yml to
# generate release notes and maintain CHANGELOG.md. Not a build dependency:
# git-cliff is a CI-only external binary and is NOT required for local builds.
# tag_pattern "v[0-9]*" matches the same namespace as the version-injection
# path (git describe --match 'v[0-9]*'), skipping the m1..m9 milestone tags.

[changelog]
header = """
# Changelog\n
All notable changes to yanshi are documented here. The file is generated by
[git-cliff](https://github.com/orhun/git-cliff) from Conventional Commits; see
`docs/commit-convention.md` for the prefix subset.\n
"""
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}(`{{ commit.scope }}`) {% endif %}{{ commit.message | upper_first }}\
    {% endfor %}
{% endfor %}\n
"""
trim = true
footer = ""

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
require_conventional = false
filter_commits = false
tag_pattern = "v[0-9]*"
commit_preprocessors = []
commit_parsers = [
    # Any type may be breaking, not just feat. The rule used to be "^feat!",
    # so `fix(api)!: drop ThreadSnapshot.Items` — a removal from the wire
    # contract — fell through to ^fix and shipped as an ordinary bug fix.
    # Conventional Commits puts the ! on the type/scope of ANY type.
    { message = "^[a-z]+(\\(.+\\))?!:", group = "⚠ Breaking Changes" },
    { body = ".*BREAKING CHANGE.*", group = "⚠ Breaking Changes" },
    { message = "^feat", group = "Features" },
    { message = "^fix", group = "Bug Fixes" },
    { message = "^perf", group = "Performance" },
    { message = "^refactor", group = "Refactor" },
    { message = "^docs", group = "Documentation" },
    { message = "^test", group = "Tests" },
    # style is a standard Conventional Commits type and the history already has
    # one (`style: gofmt the whole tree`).
    #
    # Measured with git-cliff 2.6.1 rather than assumed: without this rule the
    # commit does NOT vanish — cliff derives a group name from the type and
    # emits a free-floating "### Style" section. The plan for this task
    # predicted silent disappearance; a probe (drop the rule, regenerate, diff)
    # showed otherwise. The real defect is milder and still worth fixing: that
    # section escapes the ordering and naming every other group here declares,
    # so where it lands is whatever cliff decides. Grouped with chore/ci/build,
    # which is what a tree-wide gofmt is.
    { message = "^style", group = "Maintenance" },
    { message = "^chore\\(release\\)", skip = true },
    { message = "^chore|^ci|^build", group = "Maintenance" },
    { message = "^revert", group = "Reverted" },
]
