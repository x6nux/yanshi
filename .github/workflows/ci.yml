# PR / push-to-main gate. Fast path: must pass and blocks merge (set the four
# hard jobs — test, vet, race, build — as required in GitHub branch protection).
# Windows runs only test + build (race/vet are ubuntu-only to control cost).
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}${{ matrix.shard }})
    runs-on: ${{ matrix.os }}-latest
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu, windows, macos]
        shard: ["", "-heavy"]
        exclude:
          # Only windows needs the heavy/light split: its leg was the
          # CI wall-clock bottleneck (~23min vs ubuntu/macos ~5min) because
          # two CPU-bound packages (agent/orchestrator ~220s, api/http
          # ~200s on 4 vCPU) sit in one job on a 4-core runner. ubuntu
          # carries the whole suite in one job (it is fast there and the
          # race/coverage jobs already slice it differently); macos is
          # likewise under 5min.
          - os: ubuntu
            shard: "-heavy"
          - os: macos
            shard: "-heavy"
    env:
      # 无 dbus session 的 runner 上，go-keyring 的 SessionBus() 会走
      # autolaunch：fork dbus-launch 等 X11，永不返回——bootstrap 的
      # LiveRun 家族因此挂满 10m 包超时（panic: test timed out，2026-08-27
      # 起 ubuntu/race/coverage 三处同源）。指一个不可达地址让 godbus 直接
      # dial 失败，keyring 探测落进代码既有的降级路径（日志
      # "no secrets backend is configured" 即该路径的正确输出）。
      # windows/macos 的 keyring 不经过 dbus，此变量对它们无效。
      DBUS_SESSION_BUS_ADDRESS: unix:path=/nonexistent
      # The hosted windows runner's service token cannot host a
      # WRITE_RESTRICTED child (CreateRestrictedToken -> ERROR_INVALID_PARAMETER),
      # so the confinement behavioural tests cannot run there. This is the
      # project's own opt-out switch (see restrictedtoken_windows_test.go):
      # the tests downgrade to skips with the probe's reason attached, and
      # stay Fatal on any host where the probe merely fails unexpectedly.
      YANSHI_RESTRICTEDTOKEN_TESTS_OPTIONAL: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # W-B fix-b57 finding 4: without bubblewrap on the ubuntu leg, every      # TestBwrapReally* enforcement test (internal/sandbox) skips instead of
      # verifying, and if the runner's kernel also lacks Landlock the whole
      # linux enforcement story for W-B-23 goes green without a single test
      # actually confining anything. Installing it here turns those from
      # "may skip forever" into "always gives a verdict".
      - name: install bubblewrap and Noto CJK fonts (linux sandbox + tuidbg render tests)
        if: matrix.os == 'ubuntu'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap fonts-noto-cjk
      # ubuntu-24.04 images ship AppArmor's unprivileged-userns restriction,
      # which makes EVERY bwrap invocation fail with exit 1 even with the
      # binary installed. Sandbox probes then walk the degraded fallback
      # (landlock-helper retry + managed-proxy spin-up per subprocess), and
      # under -race that overhead compounded past the 10m package deadline.
      # Lifting the restriction is the documented GitHub-Actions workaround:
      # the runner is a single-tenant VM, so userns buys back containment
      # that only CI's own tests consume.
      - name: allow unprivileged user namespaces (bwrap needs them on 24.04)
        if: matrix.os == 'ubuntu'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # TestAstSearchReal_* drive the REAL ast-grep binary. The runner image's
      # preinstalled sg is too old to know the `run` relational group
      # ("sg: group 'run' does not exist"), which fails four tests that are
      # about yanshi's parsing of ast-grep's output, not about which sg
      # version a runner happened to ship. Pin a current binary.
      - name: install current ast-grep (runner's prebuilt sg is too old)
        if: matrix.os == 'ubuntu'
        run: sudo npm install -g @ast-grep/cli
      # e2e_real build tag is off by default -> codex/claudecode CLIs are not
      # needed. eino/bootstrap t.Skip on missing providers is expected, not a fail.
      #
      # Sharding (windows -heavy/-light): the heavy shard takes the two
      # CPU-bound packages that dominate the leg; the light shard takes
      # everything else. Both also run the bubbletea fork below so the
      # windows-only Ctrl+Enter guard executes regardless of shard.
      - name: "go test (heavy shard: orchestrator + api/http)"
        if: matrix.shard == '-heavy'
        run: go test -timeout 20m ./internal/agent/orchestrator/ ./internal/api/http/
      - name: "go test (light shard: everything else)"
        if: matrix.shard == ''
        shell: bash
        run: |
          go test $(go list ./... | grep -v -e 'internal/agent/orchestrator' -e 'internal/api/http')
      - name: "go test (unsharded legs: single job carries the whole suite)"
        if: matrix.shard == '' && matrix.os != 'windows'
        run: go test ./...
      # RE-26: third_party/bubbletea is a SEPARATE module (go.mod there, wired
      # in by a replace directive), so the main module's `go test ./...` above
      # cannot reach it -- `go list ./...` does not even mention it. Every test
      # in the fork had therefore never run in CI, including
      # key_windows_ctrlenter_test.go, the sole automated guard on the one
      # behaviour CLAUDE.md names as the reason the fork exists (telling
      # Ctrl+Enter from Enter on Windows), and the six title/notify tests W-E
      # listed as its byte-level acceptance evidence.
      #
      # This is a STEP on the existing test matrix rather than a new job on
      # purpose: the fork's load-bearing divergence from upstream is
      # Windows-only, so it has to run on the same ubuntu/windows/macos legs
      # the main suite already has -- a standalone ubuntu job would still leave
      # the Ctrl+Enter test unexecuted.
      - name: go test (third_party/bubbletea fork -- separate module)
        run: go test -C third_party/bubbletea ./...

  vet:
    name: vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...

  # O8. yanshi executes shell commands and spawns subprocesses on the user's
  # machine, so a CVE anywhere in the dependency chain is a CVE in a security
  # boundary — and nothing in this repo was watching for one. govulncheck is
  # the right tool rather than a generic SCA scanner because it is
  # reachability-based: it reports only vulnerabilities whose affected symbols
  # this binary actually calls, so the signal does not drown in advisories for
  # code paths that are compiled in but never entered.
  #
  # HARD gate. A soft one would report into a log nobody reads, which is the
  # failure mode `governance` and `fuzz-seed` were tightened out of in W0. If a
  # finding is genuinely not actionable, the fix is to record that judgement
  # (bump, replace, or an explicit -show=... exclusion with a reason) rather
  # than to let the whole job go advisory.
  vulncheck:
    name: vulncheck (govulncheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: scan
        run: govulncheck ./...

  # race is a compiler flag, not a test asset — it works on any Go code, so it
  # is a HARD gate (no soft-enable on E2/RAC1).
  #
  # Retry per-package: the race detector instruments every memory access, which
  # stretches the orchestrator/ADK/WS timing enough that a few timing-sensitive
  # tests flake on a single run (the same tests pass on the identical tree in
  # a non-race run and on re-run). A genuine DATA RACE reproduces on every run
  # and fails all 3 attempts; a -race timing flake typically passes on retry.
  # This keeps the gate hard (a real race still fails) without blocking on
  # environmental nondeterminism.
  race:
    name: race
    runs-on: ubuntu-latest
    env:
      # 与 test job 同因：无 dbus session 时 go-keyring autolaunch 挂死，
      # -race 下更慢，包内 600s 超时必然打爆。见 test job 的注释。
      DBUS_SESSION_BUS_ADDRESS: unix:path=/nonexistent
      # The hosted windows runner's service token cannot host a
      # WRITE_RESTRICTED child (CreateRestrictedToken -> ERROR_INVALID_PARAMETER),
      # so the confinement behavioural tests cannot run there. This is the
      # project's own opt-out switch (see restrictedtoken_windows_test.go):
      # the tests downgrade to skips with the probe's reason attached, and
      # stay Fatal on any host where the probe merely fails unexpectedly.
      YANSHI_RESTRICTEDTOKEN_TESTS_OPTIONAL: "1"
    steps:
      - uses: actions/checkout@v4
      # cmd/tuidbg's render tests need a font that actually carries CJK
      # glyphs: the runner only ships DejaVu, the chain falls through every
      # candidate, and TestChainRendersCJK/TestWideGlyphSpansBothColumns
      # failed on the missing ink rather than on any code defect.
      - name: install bubblewrap and Noto CJK fonts (linux-only test deps)
        run: sudo apt-get update && sudo apt-get install -y bubblewrap fonts-noto-cjk
      # See the same step in the test job: 24.04's AppArmor userns restriction
      # defeats bwrap entirely, and the degraded sandbox fallback is what blew
      # both this job's and the test job's deadlines under -race.
      - name: allow unprivileged user namespaces (bwrap needs them on 24.04)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # 与 test job 同因：runner 预装的 sg 不认识 run 关系组，race 下跑的
      # TestAstSearchReal_* 同样需要当前版 ast-grep。见 test job 注释。
      - name: install current ast-grep (runner's prebuilt sg is too old)
        run: sudo npm install -g @ast-grep/cli
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: go test -race ./...
        shell: bash
        # One `go test -race ./...` invocation instead of a serialized
        # per-package bash loop. The loop ran packages strictly one at a
        # time (~22min: orchestrator alone is 200s+ under -race on a
        # 4-core runner, and everything waited behind it); `go test ./...`
        # schedules packages in parallel across cores and reuses the build
        # cache between packages, which the loop's repeated `go test` calls
        # could not. The old loop's 3-attempt retry existed to absorb -race
        # timing flakes; those root causes are fixed (landlock workspace,
        # store SIGBUS, V8 close-vs-unlock, batch barrier), so a straight
        # run is both faster and at least as honest — a real race still
        # fails the job. Timeout is per-package, matching the loop's.
        run: go test -race -timeout 600s ./...

  build:
    name: build (${{ matrix.os }}, ${{ matrix.tags }})
    runs-on: ${{ matrix.os }}-latest
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu, windows, macos]
        tags: [default, nokeyring]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: build
        env:
          CGO_ENABLED: "0"
        shell: bash
        run: |
          tag_flag=""
          if [ "${{ matrix.tags }}" = "nokeyring" ]; then tag_flag="-tags=nokeyring"; fi
          go build $tag_flag ./cmd/yanshi
      - name: smoke -h
        # fork compiles in (replace => ./third_party/bubbletea is tracked); the
        # binary must at least print usage and exit 0.
        shell: bash
        run: ${{ matrix.os == 'windows' && './yanshi.exe -h' || './yanshi -h' }}

      # O9. `-h` proves the binary links; it proves nothing about whether it can
      # bootstrap. Every failure mode that actually ships — a store schema that
      # will not open, a composition-root panic, a provider registry that
      # rejects the example config, a nokeyring build whose secrets backend is
      # absent — leaves `-h` exiting 0. `exec --fake-model` drives the real
      # bootstrap chain (config -> store -> model -> tools -> orchestrator) and
      # a full turn end to end without needing an API key.
      #
      # Run from a scratch directory with a copy of the tracked example config:
      # config.yaml is gitignored, and `exec` refuses to start without one, so
      # running in the repo root would fail for a reason unrelated to the
      # artifact. This also exercises the path a new user takes on day one.
      #
      # The turn output is asserted, not just the exit code: the fake model is
      # deterministic, so a bootstrap that comes up but produces no assistant
      # text is a regression this step must catch.
      - name: smoke bootstrap (headless turn, fake model)
        shell: bash
        run: |
          set -e
          bin="$PWD/${{ matrix.os == 'windows' && 'yanshi.exe' || 'yanshi' }}"
          work="$(mktemp -d)"
          cp config.example.yaml "$work/config.yaml"
          cd "$work"
          "$bin" exec -fake-model -p "hello" -output jsonl -timeout 60s >out.jsonl
          cat out.jsonl
          grep -q '"type":"agent_chunk"' out.jsonl
          grep -q '"type":"done"' out.jsonl

  # --- hard gates: archtest governance and fuzz/property ---------------------
  # Both were soft ("continue-on-error") while the E3 and E2 assets were being
  # built. Those assets landed, and governance grew to carry the assembly,
  # context-injection and ledger gates on top of the original layering ones —
  # a regression there is exactly the failure mode W0 exists to prevent, so it
  # must fail the build. (Deliberately not a gate list; see the scope note
  # below for why this comment states coverage by exclusion.)
  #
  # This job runs ./internal/archtest ONLY. Scope is stated as an EXCLUSION,
  # not as a list of the gates included: the included set grows (a closed
  # enumeration here already went stale once by omitting GOV9, whose eight
  # tests this job has been running all along — an enumeration whose stated
  # purpose is precision, wrong in the direction of under-claiming), while the
  # excluded set is fixed by where the gates have to live.
  #
  # Excluded: GOV5 and GOV7 only. They live in internal/bootstrap/wiring_test.go
  # because they reconcile a really-assembled App.ToolNames against the profile,
  # which is reachable only inside the composition root; the main
  # `go test ./...` job carries them. Naming them here would claim coverage this
  # job does not have.
  #
  # Everything else under internal/archtest is covered by definition — the GOV
  # gates that live there, the feature-status ledger assertions, and the
  # unnumbered gates (D2/O12 removal, phantom slash commands). For the current
  # roster: grep -rn '^func Test' internal/archtest/

  # bench-compiles is a HARD gate, and the reason is specific:
  # BenchmarkOrchestratorTurn was broken for an unknown length of time while CI
  # stayed green, because the only bench job was continue-on-error. A benchmark
  # that fails to RUN is a broken test, not a slow one -- the numbers are a
  # trend signal and stay soft in nightly, but "does it execute" is a fact CI
  # can assert cheaply.
  #
  # -benchtime=10x, never 1x: 1x is precisely the value that hid the bug (a
  # FakeModel exhausts its script on the second iteration).
  bench-compiles:
    name: benchmarks run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -run '^$' -bench=. -benchtime=10x ./internal/vcs ./internal/tools ./internal/agent/orchestrator

  lsp-e2e:
    name: lsp-e2e (real gopls)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # TestRealGoplsReportsTheBrokenLine skips when gopls is absent, and a test
      # that always skips reads as a pass. This step is what makes B2/LSP1's
      # end-to-end clause an executed assertion rather than a permanent skip.
      # Pinned, not @latest. The assertion is a diagnostic's line number, which
      # is a property of gopls output — an upstream change would turn this job
      # red for a reason that has nothing to do with a change in this repo, and
      # the first person to see it would have no way to tell the difference.
      # Bump deliberately.
      - name: install gopls
        run: go install golang.org/x/tools/gopls@v0.22.0
      - name: run the real-server test
        run: |
          set -e
          # -run pins the one test; -v so the log distinguishes PASS from SKIP,
          # and the grep turns a skip into a job failure — otherwise a broken
          # install step would leave this job green for the wrong reason.
          out=$(go test ./internal/lsp -run TestRealGoplsReportsTheBrokenLine -v -timeout 120s)
          echo "$out"
          echo "$out" | grep -q -- '--- PASS: TestRealGoplsReportsTheBrokenLine'

  governance:
    name: governance (all archtest gates except GOV5/GOV7 + ledger)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: run governance tests
        run: go test ./internal/archtest

  fuzz-seed:
    name: fuzz-seed (E2 FUZ1/PROP1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: run fuzz seeds + property tests if present
        shell: bash
        run: |
          set -e
          # Missing targets FAIL. This used to soft-pass and exit 0, so deleting
          # every fuzz and property target left the job green — the escape
          # hatch lived in the shell, not on a YAML key, and no gate could see
          # it. E2's assets (FuzzMatchGlob plus internal/ctxcompact's
          # TestProperty_*) have landed, so the stated precondition is met.
          #
          # The listing is captured before grep runs, not piped straight into
          # `grep -q`: with pipefail, grep -q exits at the first match and
          # closes the pipe while `go test -list` is still writing the
          # remaining packages' output — the writer then dies of SIGPIPE, the
          # pipeline reports failure, and the `if !` misreads that as "no
          # targets". That false negative is exactly what this gate exists to
          # prevent, and it is what flipped this job red on 2026-08-27.
          # Collecting first keeps the gate exactly as strict: a listing with
          # no fuzz/property target still fails here, and a compile error now
          # surfaces instead of being silenced into the same message.
          fuzz_targets="$(go test -list 'Fuzz.*|TestProperty.*' ./internal/guard/... ./internal/ctxcompact/...)"
          if ! printf '%s\n' "$fuzz_targets" | grep -Eq 'Fuzz|TestProperty'; then
            echo "no fuzz/property target found in internal/guard or internal/ctxcompact — " \
                 "they were removed, or a package moved. This job exists to run them." >&2
            exit 1
          fi
          go test -run 'Fuzz|TestProperty' -count=1 ./internal/guard/... ./internal/ctxcompact/...

  # Hard gate. .goreleaser.yaml is only exercised by release.yml, which fires
  # on `v*` tags — so a config error stays invisible until the one moment it
  # breaks the release. goreleaser parses with UnmarshalStrict, meaning a key
  # removed between majors is a fatal error, not a warning. `check` validates
  # the config without building anything, so run it on every PR.
  release-config:
    name: release-config (goreleaser check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          # v2.7 floor: archives.format_overrides uses the plural `formats`
          # key, which older v2.x rejects outright. Keep in lockstep with
          # release.yml so `check` validates the version release actually uses.
          version: "~> v2.7"
          args: check

  # Hard gate. sdk/ts and sdk/python carry the client half of the wire
  # contract, and until this job existed NO workflow ran either suite: the only
  # mention of them anywhere in .github/ was docs.yml doing `tsc --noEmit` and
  # `import yanshi_sdk` — a typecheck and an import smoke. `vitest` and
  # `pytest` had zero hits across every workflow file, so 60-odd contract
  # assertions were running on developer machines only.
  #
  # It lives here rather than in docs.yml because docs.yml is paths-filtered:
  # an sdk-only change would skip the job that tests it.
  sdk-contract:
    name: sdk-contract (vitest + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: TypeScript contract tests
        run: |
          npm --prefix sdk/ts install --no-audit --no-fund
          ( cd sdk/ts && npx vitest run )
      - name: Python contract tests
        run: |
          pip install -e 'sdk/python[test]'
          pytest sdk/python -q

  # Hard gate. Until W10 there was no coverage gate anywhere — `rg -- '-cover'
  # .github/workflows/` returned nothing — so any of these packages could have
  # gone from 94% to 20% without a job turning red. Thresholds live in
  # cmd/covercheck and are max(spec floor, measured - 3pp), so the gate is a
  # real ratchet rather than the 20-45 points of free regression the spec
  # floors alone would have allowed.
  coverage:
    name: coverage (per-package floors)
    runs-on: ubuntu-latest
    env:
      # 与 test job 同因：无 dbus session 时 go-keyring autolaunch 挂死，
      # coverage 插桩更慢，10m 包超时必然打爆。见 test job 的注释。
      DBUS_SESSION_BUS_ADDRESS: unix:path=/nonexistent
      # The hosted windows runner's service token cannot host a
      # WRITE_RESTRICTED child (CreateRestrictedToken -> ERROR_INVALID_PARAMETER),
      # so the confinement behavioural tests cannot run there. This is the
      # project's own opt-out switch (see restrictedtoken_windows_test.go):
      # the tests downgrade to skips with the probe's reason attached, and
      # stay Fatal on any host where the probe merely fails unexpectedly.
      YANSHI_RESTRICTEDTOKEN_TESTS_OPTIONAL: "1"
    steps:
      - uses: actions/checkout@v4
      # Same deps the test (ubuntu) leg installs: without bwrap every
      # bootstrap sandbox probe walks the degraded path (landlock helper
      # retry + managed-proxy spin-up per subprocess), which under coverage
      # instrumentation compounded past the package's 10m deadline and
      # panicked the job (2026-08-31); fonts-noto-cjk lets cmd/tuidbg's
      # render tests find real CJK ink under -cover too.
      - name: install bubblewrap and Noto CJK fonts (coverage needs what test needs)
        run: sudo apt-get update && sudo apt-get install -y bubblewrap fonts-noto-cjk
      # Same userns lift as the other ubuntu legs: bwrap installed but unable
      # to create a sandbox still means degraded-fallback slowdowns, and that
      # is what timed this job out even after bwrap landed here.
      - name: allow unprivileged user namespaces (bwrap needs them on 24.04)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go run ./cmd/covercheck -v
