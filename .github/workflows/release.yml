# Release on tag push. git-cliff generates notes from Conventional Commits
# (cliff.toml, tag_pattern v[0-9]*), then goreleaser builds four nokeyring
# targets, attaches checksums.txt, and publishes the GitHub Release.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # git-cliff needs full history to group by tag

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # git-cliff is a CI-only external binary (not in go.mod). Pin a version.
      - name: install git-cliff
        shell: bash
        run: |
          curl -sSL https://github.com/orhun/git-cliff/releases/download/v2.6.1/git-cliff-2.6.1-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz -C /tmp
          echo "/tmp/git-cliff-2.6.1" >> "$GITHUB_PATH"

      - name: generate release notes
        shell: bash
        run: git-cliff --config cliff.toml --latest --output RELEASE_NOTES.md

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          # v2.7 floor: archives.format_overrides uses the plural `formats`
          # key. ci.yml's release-config job runs `check` against the same
          # constraint, so config errors surface on PRs instead of on tag push.
          version: "~> v2.7"
          args: release --clean --release-notes RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # CHANGELOG.md is regenerated AFTER the release, and its failure must not
      # take the release with it.
      #
      # Two defects lived in the version of these steps that ran before
      # goreleaser. Neither had ever fired, because this repository has no tags
      # at all and release.yml has never run.
      #
      # 1. It passed --latest. That flag emits only the newest tag's section
      #    while --output OVERWRITES the file. The first release would have
      #    looked fine (no previous tag means the range is all of history);
      #    the SECOND would have replaced CHANGELOG.md with just v2's section
      #    and dropped v1 from the file entirely. RELEASE_NOTES.md above keeps
      #    --latest, which is exactly right for it — those notes describe one
      #    release.
      #
      # 2. It pushed to main from a tag build. A tag push checks out a detached
      #    HEAD, so `git push origin HEAD:main` is a non-fast-forward the
      #    moment main has moved on — the step fails, and with the step ordered
      #    before goreleaser, the whole Release never goes out. A changelog
      #    write-back must never gate artifact publication.
      - name: update CHANGELOG.md
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -e
          git-cliff --config cliff.toml --output CHANGELOG.md
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "chore(release): update changelog for ${GITHUB_REF_NAME}" \
            || { echo "no changelog changes"; exit 0; }
          # Push to the branch, not to the detached HEAD this tag build is on.
          git push origin HEAD:refs/heads/main
