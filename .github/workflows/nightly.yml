# Nightly slow path: long fuzz, benchmarks, full multi-platform race. Does NOT
# block merge (no required checks here). Bench is trend-only (no hard gate).
name: nightly

on:
  schedule:
    - cron: "17 3 * * *"   # 03:17 UTC daily (off-the-hour to ease runner load)
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  fuzz-long:
    name: fuzz-long (E2 FUZ1)
    runs-on: ubuntu-latest
    # Hard gate since W10. The comment here used to read "soft until E2 fuzz
    # targets land" — FuzzMatchGlob has landed, so the stated precondition is
    # met. Leaving it soft would also defeat the point: nightly blocks no
    # merge, so continue-on-error's ONLY effect is turning red into silence,
    # and a fuzz job's entire value is the alert.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: long fuzz if target present
        shell: bash
        run: |
          set -e
          # Missing targets FAIL. This used to soft-pass and exit 0, which
          # meant deleting every fuzz target left the job green — the escape
          # hatch was in the shell, not on the YAML key, so removing
          # continue-on-error alone would not have closed it.
          #
          # The listing is captured before grep runs, not piped straight into
          # `grep -q`: with pipefail, grep -q exits at the first match and
          # closes the pipe while `go test -list` is still writing the rest —
          # the writer dies of SIGPIPE, the pipeline reports failure, and the
          # `if !` misreads that as "no targets". That false negative is what
          # flipped fuzz-long red on every nightly since 2026-08-29 (the same
          # defect ci.yml's fuzz-seed had). Dropping 2>/dev/null also lets a
          # compile error surface instead of masquerading as "no targets".
          fuzz_targets="$(go test -list 'Fuzz.*' ./internal/guard/...)"
          if ! printf '%s\n' "$fuzz_targets" | grep -q '^Fuzz'; then
            echo "no Fuzz target found under internal/guard — they were removed, " \
                 "or the package moved. This job exists to run them." >&2
            exit 1
          fi
          go test -fuzz=FuzzMatchGlob -fuzztime=10m ./internal/guard/...

  bench:
    name: bench trend (soft)
    runs-on: ubuntu-latest
    # Trend-only, deliberately soft: ns/op on a shared runner swings well past
    # the 20% threshold from neighbour load alone, so a hard gate here
    # manufactures flakes rather than catching regressions. "Do the benchmarks
    # RUN" is asserted hard in ci.yml (bench-compiles); this job answers the
    # different question of whether they got slower.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: download previous baseline
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Previous nightly's artifact, via gh rather than a third-party
          # action: this repository's supply-chain posture is that CI pulls
          # only from GitHub itself. A miss (first run, expired retention) is
          # not an error -- benchstat is simply skipped below.
          set -euo pipefail
          prev=$(gh run list --workflow nightly.yml --status success \
                   --limit 2 --json databaseId --jq '.[1].databaseId' || true)
          if [ -n "${prev:-}" ]; then
            mkdir -p .bench-results
            gh run download "$prev" -n bench-results -D .bench-results || true
            [ -f .bench-results/new.txt ] && mv .bench-results/new.txt .bench-results/old.txt || true
          fi

      - name: bench + trend
        shell: bash
        run: |
          set -euo pipefail
          # Same pipefail+grep -q SIGPIPE shape as fuzz-long above: capture the
          # listing first, then grep it. Bench is trend-only, but a false "no
          # benchmarks" here would silently skip the trend entirely.
          bench_targets="$(go test -list 'Benchmark.*' ./...)"
          if ! printf '%s\n' "$bench_targets" | grep -q '^Benchmark'; then
            echo "no Benchmark target found"
            exit 0
          fi
          go install golang.org/x/perf/cmd/benchstat@latest
          # bench.sh keeps stderr out of the results file; slog writes there and
          # its lines would otherwise land in the data benchstat parses.
          ./scripts/bench.sh --diff | tee bench-console.txt
          cp .bench-results/new.txt bench-results.txt
          {
            echo "## Benchmark trend"
            echo '```'
            if [ -f .bench-results/old.txt ]; then
              benchstat .bench-results/old.txt .bench-results/new.txt || true
            else
              echo "(no previous baseline — first run or artifact expired)"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: upload bench results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: bench-results.txt
          if-no-files-found: ignore

  race-full:
    name: race-full (${{ matrix.os }})
    runs-on: ${{ matrix.os }}-latest
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu, windows, macos]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race ./...

  release-snapshot:
    name: release-snapshot (PKG1 artifacts build)
    runs-on: ubuntu-latest
    # `goreleaser check` in ci.yml only proves the config PARSES. Until W10 ran
    # it by hand, nothing had ever verified that the artifacts build, that the
    # archives carry LICENSE/README/config.example.yaml, or that the
    # CGO_ENABLED=0 -tags=nokeyring binary actually starts. The repo has no
    # tags at all, so release.yml has never fired.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2.7"
          args: release --snapshot --clean --skip=publish
      - name: verify the artifacts
        shell: bash
        run: |
          set -e
          archives=$(ls dist/*.tar.gz dist/*.zip | wc -l)
          [ "$archives" -eq 4 ] || { echo "expected 4 archives, got $archives" >&2; exit 1; }
          [ "$(wc -l < dist/checksums.txt)" -eq 4 ] || { echo "checksums.txt is short" >&2; exit 1; }
          # The archive must carry the licence, or every downloaded copy ships
          # without the notice MIT requires.
          tar tf dist/yanshi_*_linux_amd64.tar.gz | grep -qx LICENSE
          tar tf dist/yanshi_*_linux_amd64.tar.gz | grep -qx config.example.yaml
          # The only real smoke test of the nokeyring build.
          rm -rf /tmp/relsmoke && mkdir -p /tmp/relsmoke
          tar xf dist/yanshi_*_linux_amd64.tar.gz -C /tmp/relsmoke
          /tmp/relsmoke/yanshi -h > /dev/null
