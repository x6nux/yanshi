# models.yaml is the embedded, data-driven model capability catalog for
# W-C-01 (INF2). Adding a model or a price is an edit to THIS file — no Go
# code change (see modelcatalog.go, which parses it; contextwindow.go and
# pricing.go, which are BUILT from it at package init).
#
# Schema (docs/superpowers/specs/2026-08-27-capability-roadmap-design.md
# §1.2 INF2), one row per model or model family:
#
#   id                      canonical id, or a bare family fragment for a
#                           catch-all row (see "Two kinds of row" below).
#                           Required, must be unique within this file.
#   aliases                 optional list of extra ids/fragments that answer
#                           for this same row (gateway-prefixed spellings,
#                           legacy names). Matched the same way `id` is.
#   context_window          optional input-token window. Absent/0 = this row
#                           has no opinion on window size — resolution falls
#                           through to the next-longest matching row, then
#                           the conservative default (see
#                           ResolveContextWindow in contextwindow.go).
#   auto_compact_threshold  optional override for CompactionConfig.Threshold.
#                           It is a FRACTION of context_window (e.g. 0.8),
#                           never an absolute token count — mixing the two
#                           units silently mis-sizes the compaction gate
#                           (ADR-0013's dimensional constraint). Absent =
#                           the operator's configured/global default applies
#                           unchanged. A NEGATIVE value is a different thing
#                           from absent: it explicitly disables compaction
#                           for that one model regardless of the global
#                           switch (see ResolveAutoCompactThreshold's doc
#                           comment, W-C-04/ADR-0024). Ruling RC-3: this
#                           ticket (W-C-01) ships ZERO rows with this field
#                           populated — see the note before the `models:`
#                           list below for why; do not treat its absence
#                           from every row here as an oversight to "fill in".
#                           (This bullet previously cited "Ruling W-C-03" —
#                           a Ruling ID and a spec ticket ID collide in that
#                           spelling; see progress.md's own warning about
#                           this exact mistake. Corrected to RC-3, the real
#                           Ruling ledger entry, while adding fallback_models
#                           below under Ruling RC-8.)
#   fallback_models         optional ordered list of model ids to fall back to
#                           when this model's own compaction summary call
#                           fails outright (exhausted retries, quota,
#                           overload — the same failure class RunSummary
#                           reports and W-C-04's pins-only path exists to
#                           survive). This is NOT general turn-answering
#                           fallback — only the compaction summarizer uses
#                           this chain (see KnownFallbackModels in
#                           modelcatalog.go, W-C-10). Declared ids that are
#                           not configured providers in a given deployment
#                           are skipped at resolution time, not an error.
#                           Ruling RC-8: like auto_compact_threshold under
#                           RC-3, this ticket ships ZERO rows with this field
#                           populated — see the note before the `models:`
#                           list below for why.
#   pricing                 optional input_per_m / cache_hit_per_m /
#                           output_per_m in USD per million tokens. Absent =
#                           CostOK/Ledger.Cost report the model unknown
#                           ("N/A"), never $0.00.
#   max_output              reserved for a future W-C ticket (max output
#                           tokens). Parsed but not consumed yet.
#   modalities              reserved for a future W-C ticket (multimodal
#                           capability probing, B47). Parsed but not
#                           consumed yet.
#   reasoning_efforts       reserved for a future W-C ticket (valid
#                           reasoning-effort values per model). Parsed but
#                           not consumed yet.
#   truncation_policy       optional override for the head/tail line-count
#                           policy internal/tools/spillover.go applies to an
#                           oversized tool result before it reaches the
#                           model. Format is "head=<N>,tail=<M>" (either key
#                           may be omitted; the other keeps
#                           DefaultTruncationSpec's value) — see
#                           ParseTruncationPolicy in modelcatalog.go, which
#                           this file's loader (mustParseModelCatalog) also
#                           uses to reject an unparsable row at package init
#                           rather than let it surface as a silent
#                           always-default. Absent = the operator's
#                           configured ProviderConfig.TruncationPolicy, or
#                           failing that DefaultTruncationSpec, applies
#                           unchanged (see ResolveTruncationPolicy's doc
#                           comment, W-C-09). Ruling RC-9: this ticket ships
#                           ZERO rows with this field populated — see the
#                           note before the `models:` list below for why; do
#                           not treat its absence from every row here as an
#                           oversight to "fill in".
#   priority                reserved for a future W-C ticket (provider
#                           selection ordering). Parsed but not consumed yet.
#
# TWO KINDS OF ROW, both matched by the SAME boundary-anchored substring
# algorithm with longest-match-wins (matchesAtBoundary in contextwindow.go;
# see that file's header for why boundary-anchored substring matching exists
# — it is what lets one row answer for every gateway/region prefix an
# operator might type):
#
#   - FAMILY rows (id is a bare fragment like "claude", "gpt-4") record the
#     safe LOWER documented bound for every snapshot in that family that has
#     no more specific row of its own.
#   - SPECIFIC rows (id is an exact shipped model id like "claude-opus-4-8")
#     win over the family row for that one id, and are the only rows this
#     file gives pricing to: dollar amounts genuinely differ per snapshot
#     while the context window usually does not.
#
# Pricing, auto_compact_threshold, fallback_models, and truncation_policy
# resolution are all EXACT-match against id/aliases (see catalogAliases in
# modelcatalog.go) — NOT boundary-substring like context_window. A price (or
# a truncation policy) quietly applying to every gateway-prefixed variant of
# a model id would be a bigger behavior change than this ticket's job of
# transcribing two existing Go literal tables into data.
#
# Values below are transcribed unchanged from the two Go literal tables this
# file replaces (contextwindow.go's former contextWindowCatalog var,
# pricing.go's former DefaultPricing body) — see git history on either file
# for provenance notes on individual numbers.
#
# auto_compact_threshold has ZERO rows below (Ruling RC-3, see review-c1.md
# F-4/ADR-0024). There was no third Go literal table to transcribe it from —
# the field, the parser, and the resolution ladder (ResolveAutoCompactThreshold)
# are all real and tested this round, but the per-model NUMBERS are not: no
# per-provider auto-compact ratios existed anywhere in this codebase before
# W-C-01, and fabricating plausible-looking ones here would misrepresent
# vendor-published guidance as researched data when none was. A future W-C
# ticket adds real numbers, sourced and cited per row, not invented to make
# this file look more complete than the research behind it.
#
# fallback_models has ZERO rows below (Ruling RC-8, W-C-10's C4 batch — the
# same shape RC-3 shipped for auto_compact_threshold above, and explicitly
# anticipated by RC-3's own text: "并且给 C4 批记一条前置 — W-C-04 / W-C-10 都
# 会假设这张表里有东西"). The field, its parser (buildFallbackModels), and its
# resolver (KnownFallbackModels) are real and tested this round; the wiring
# that CONSUMES a non-empty chain (CompactingModel.Summarizer, wrapCompaction,
# compactionModel()) is real and tested too. What is missing is the DATA: no
# researched, quality-compatible fallback pairing (which model is an
# acceptable stand-in summarizer for which primary) exists yet for any
# provider in this catalog, and inventing plausible-looking pairs here would
# misrepresent an editorial judgment call as researched guidance when none
# was made. Until a future ticket adds real rows, KnownFallbackModels always
# returns (nil, false) and every consumer of it is a no-op — byte-identical
# to pre-W-C-10 behavior.
#
# truncation_policy has ZERO rows below (Ruling RC-9, W-C-09 — the same
# "mechanism real, data empty" shape RC-3 and RC-8 shipped above). The field,
# its parser (ParseTruncationPolicy), its load-time validation
# (mustParseModelCatalog panics on a row that sets this to something
# unparsable), its table builder (buildTruncationPolicies), and its resolver
# (KnownTruncationPolicy / ResolveTruncationPolicy) are all real and tested
# this round; so is the consumer (internal/tools/spillover.go's
# spillPreview, reading TruncationPolicyFromContext). What is missing is the
# DATA: no researched, per-model editorial judgment about how many head/tail
# lines a given model's own turns should keep exists yet, and inventing
# plausible-looking numbers here would misrepresent an editorial call as
# researched guidance when none was made. Until a future ticket adds real
# rows, KnownTruncationPolicy always returns (TruncationSpec{}, false) and
# the only way to reach a non-default policy today is the operator-facing
# ProviderConfig.TruncationPolicy override.

models:
  # --- Anthropic -----------------------------------------------------------
  # 200K standard across the modern families; the 1M Sonnet variant is a
  # beta-header opt-in, so it is NOT assumed by the family row.
  - id: claude-instant
    context_window: 100000 # legacy, still served by some gateways
  - id: claude-2
    context_window: 100000 # legacy, still served by Bedrock
  - id: claude
    context_window: 200000
