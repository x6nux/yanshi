# schema_version is the config schema generation. Omit on existing configs to
# keep them forward-compatible (treated as the current version). yanshi rejects
# a value higher than it supports — upgrade yanshi first. See
# docs/upgrade-guide.md.
schema_version: 1
server:
  http_addr: "127.0.0.1:8080"
  task_addr: "127.0.0.1:8081"
storage:
  sqlite_path: "yanshi.db"
  wal_max_open_conns: 4       # F1: read pool size (1=legacy serial, 4+ for concurrent reads)
  busy_timeout_ms: 5000       # F1: cross-process lock retry window (ms)
  wal_auto_checkpoint: 1000   # F1: WAL auto-checkpoint page threshold
  # 下面三个开关默认全部关闭（0 / false），行为与引入它们之前逐字节一致。
  # 它们各自有代价，所以必须由操作员显式打开。
  #
  # retention_days: W-D-04 冷会话压缩。超过这么多天没有活动的会话，整份对话被
  #   压成一个 gzip blob，行数从 N 降到 1。**到期是压缩不是删除** —— 没有任何
  #   一条消息会消失，恢复/投影/溯源都照常读得到它。代价是压缩会把这些行移出
  #   FTS 索引，history_search 从此找不到它们；再次向该会话写入会自动解冻并
  #   重新入索引。0 = 永久保留，不压缩任何东西。
  # retention_days: 90
  #
  # memory_auto_extract: W-D-03 跨会话记忆抽取。会话安静一段时间后，后台
  #   worker 读它的窗口、向模型要一批"以后还成立的事实"、写进 memories，再走
  #   既有的蒸馏入口合并。**它花钱** —— 每个结束的会话一次 provider 调用
  #   （用 batch.rlm_model，没配就退回主模型），所以默认 false。
  # memory_auto_extract: false
  #
  # memory_quota: memories 表的行数上限。超额时只删 use_count = 0（从未被检索
  #   命中过）的行，最老的先删；用过的记忆无论多老都不删 —— 这就是配额与
  #   "过期"的区别。与 memory_auto_extract 相互独立：memory_write 一样往这张表
  #   里写。0 = 不限制。
  # memory_quota: 2000
token: "change-me"
llm:
  # max_retries (W-C-07) is the global per-attempt retry ceiling for a
  # provider that does not set its own max_retries below. Omit it (or leave
  # 0) to keep the resilient layer's own built-in default (10).
  #
  # WARNING: 0 means something different here than it does on a single
  # provider's own max_retries below. This field is a plain int, so its zero
  # value IS "omitted" — 0 (or leaving the whole llm: block out) falls back to
  # the built-in default of 10. A provider's own max_retries is a *int, which
  # CAN distinguish "omitted" from "explicitly 0" — there, 0 really does mean
  # "never retry this provider." Same digit, opposite meaning, because only
  # one of the two types has room to represent "unset."
  # max_retries: 5
  providers:
    # context_window is OPTIONAL. Omit it and yanshi resolves the window from a
    # built-in model catalog (routing prefixes like "openrouter/anthropic/...",
    # "us.anthropic....", "azure/..." are penetrated). Set it to override the
    # catalog — for a 1M-context beta, a custom deployment, or a local runtime
    # whose num_ctx you raised. Unknown models fall back to a deliberately
    # CONSERVATIVE default: guessing the window too high means compaction never
    # fires and the request dies, guessing low only costs one extra compaction.
    # A negative value is rejected at load time (review-whole.md I-1) -- unlike
    # auto_compact_threshold below, negative has no "explicitly disabled"
    # reading here.
    #
    # auto_compact_threshold is OPTIONAL and mirrors context_window's role for
    # W-C-01's data-driven model catalog: it is a FRACTION of the resolved
    # context_window (e.g. 0.75), not an absolute token count. Omit it and
    # yanshi resolves the threshold from the same built-in catalog (falls back
    # to compaction.threshold below when the catalog has no opinion either —
    # the shipped catalog currently has no rows for this field, so in practice
    # this is the only way to set it).
    # Set it to give one noisy model (heavy tool output, frequent repetition)
    # its own earlier trigger point without lowering the global default for
    # every other provider.
    #
    # max_tokens / temperature / top_p are OPTIONAL generation parameters.
    # Omitting a key leaves the provider's own default in force; setting one to
    # 0 is a real setting (temperature: 0 for deterministic judge calls) and is
    # sent to the API. Raise max_tokens when the model must emit whole files —
    # the built-in 4096 default truncates long patches.
    #
    # truncation_policy (W-C-09) is OPTIONAL and overrides how many head/tail
    # lines of an oversized tool result are kept verbatim before the rest is
    # replaced with an explicit "[... N lines omitted ...]" marker. Format is
    # "head=<N>,tail=<M>" (either key may be omitted). Omit the whole field
    # and yanshi resolves the policy from the built-in model catalog (falls
    # back to a conservative head=15,tail=10 default when the catalog has no
    # opinion either — the shipped catalog currently has no rows for this
    # field either, so in practice this is the only way to set it; unlike
    # auto_compact_threshold above, an unparsable value here does NOT fail
    # startup, it degrades the same way an absent value would, with a
    # warning logged at boot).
    #
    # fallback_models (M-2 / W-C-10) is OPTIONAL and names, in priority
    # order, the registry model ids this provider's compaction-summary call
    # falls back to when it errors — the SAME key context_window /
    # auto_compact_threshold / truncation_policy resolve against above (the
    # model: field's value, not the name: label). Omit it and yanshi
    # resolves the chain from the built-in model catalog (falls back to no
    # fallback at all when the catalog has no opinion either — the shipped
    # catalog currently has no rows for this field either, so in practice
    # this is the only way to set it). A listed id that no configured
    # provider resolves to is silently dropped, not a load-time error —
    # validating it here would need the provider registry this field is
    # itself an input to.
    - name: "openai"
      kind: "openai"
      model: "gpt-4o"
      api_key: "${OPENAI_API_KEY}"
      context_window: 128000      # this model's token window; compaction sizes against it
      # auto_compact_threshold: 0.75  # fraction of context_window; omit to use the catalog/global default
      # truncation_policy: "head=20,tail=15"  # per-model tool-output retention; omit to use the catalog/default
      # fallback_models: ["gpt-4o-mini"]  # compaction-summary fallback chain; omit to use the catalog/no-fallback default
      # max_tokens: 32000         # cap per response; omit to keep the 4096 default
      # temperature: 0.2          # omit to keep the provider default; 0 is a valid setting
      # top_p: 0.95               # tune this OR temperature, not both
      # multimodal: true          # native image input; auto-selects as vision auxiliary (Tier G)
    - name: "claude"
      kind: "anthropic"
      model: "claude-opus-4-8"
      api_key: "${ANTHROPIC_API_KEY}"
      context_window: 200000
      multimodal: true            # native image input (Tier G)
      # max_retries: 3             # W-C-07: overrides llm.max_retries for just this provider
      # headers:                   # W-C-02: extra HTTP headers sent on every request to this
      #   X-Corp-Gateway-Token: "${CORP_GATEWAY_TOKEN}"  # provider; ${VAR} expands like api_key.
      #                             # Values are as sensitive as api_key — registered with the
      #                             # redactor at boot, never logged in the clear.
      # auth:                      # W-C-12: command-based token auth, instead of a static api_key.
      #   command: ["aws", "sso-token", "print"]  # stdout (trimmed) becomes the credential.
      #   refresh_interval: 15m    # re-run the command at most this often; also re-run once after
      #                             # any 401. Omit to default to 15m. Runs through secproc.Launch
      #                             # (Authorized + credential-scrubbed), same as shell_run/ACP.
      #                             # "Credential-scrubbed" cuts both ways: the command does NOT
      #                             # inherit yanshi's own ambient credential env vars (AWS_*,
      #                             # OPENAI_API_KEY, ...) — they are wiped along with everything
      #                             # else on the credential axis before this argv is spawned. If
      #                             # your helper script itself needs a secret from the
      #                             # environment (e.g. to mint an STS token), it must obtain it
      #                             # some other way (baked into the script, a config file, its
      #                             # own login state) — yanshi will not forward it in.
    # Local runtimes (Ollama / LM Studio / vLLM / llama.cpp) are auto-detected
    # from base_url (loopback, RFC1918, *.local) or from kind, and are NEVER
    # given a cloud model's window: a local serve truncates at its own num_ctx
    # and silently drops the prompt head rather than rejecting the request.
    # Set `local: true` when a local runtime sits behind an unrecognisable
    # hostname, or `local: false` to opt a LAN-hosted gateway back into the
    # cloud catalog.
    # - name: "ollama"
    #   kind: "openai"
    #   model: "qwen3-coder:30b"
    #   api_key: "ollama"
    #   base_url: "http://127.0.0.1:11434/v1"
    #   context_window: 32768     # set this to whatever num_ctx you launched with

  # M7 出站限速。qpm: 0（默认）= 不限速，所以省略整块与升级前行为完全一致。
  # burst 是空闲后允许的连发数；留 0 由 qpm 推导并封顶，免得 `qpm: 600` 变成
  # 「允许 600 个并发」——那不是任何意义上的限速。单个 provider 可以用它自己的
  # qpm / burst 覆盖本默认值（限速桶按 model 建，共用一个全局值会让快的那个
  # provider 被慢的那个拖住）。
  # rate_limit:
  #   qpm: 60
  #   burst: 5

  # M6 工具 JSON Schema 改写策略：
  #   auto   （默认）只对**确实拒绝过** schema 的模型改写。每个模型每进程付一次
  #          失败请求的代价，只在需要的地方付改写的有损代价（无法合并的
  #          oneOf/allOf 会退化成更宽的类型）。
  #   always 对所有模型都改写。只跟严格网关说话、且不想付那一次 400 时用。
  #   never  从不改写。用于判断改写器本身是不是问题所在。
  # 写错的值归一化成 auto 而不是拒绝启动——安全行为同时也是默认行为。
  # sanitize_tool_schemas: auto

  # M9 启动期模型名自检：向每个 provider 要模型目录，名字不在目录里就告警并给出
  # 最接近的几个候选。默认开启，且**永远不会**让启动失败或阻塞——所以这个开关
  # 只有一个用途：让离线/气隙部署不必在每次启动时等那几个必然超时的探测。
  # preflight: false

  # W-A-06 流式空闲超时看门狗：first 卡的是「上游有没有开始回」（网关接受连接后
  # 一言不发会一直卡在 Recv 里，DeadlineGate 只在 ReAct 迭代边界检查，救不了
  # 这种情况）；idle 卡的是「上游还在不在动」，必须给得比 first 松——长推理轮次
  # 里 chunk 间隔本来就可能很大。两者各自默认 0 = 关闭，不设非零默认值，行为
  # 与本字段引入前逐字节一致（同 loopguard「零值即关闭」的原则）。只有内容块能
  # 续命，纯控制/心跳块不会。
  # stream_first_chunk_timeout: 30s
  # stream_idle_timeout: 2m

agents:
  - name: "orchestrator"
    type: "local"
    chain: ["openai", "claude"]
    profile: "orchestrator"
    capabilities: []
skills:
  builtin_dir: ./skills
  user_dir: ~/.yanshi/skills
  plugin_dir: ~/.yanshi/plugins
vcs:
  ignore: ["coverage", ".cache"]          # extra ignore patterns (merged with defaults)
  worktree_dir: "~/.yanshi/worktrees"   # where worktree working dirs live
compaction:
  threshold: 0.8        # compact when est. tokens >= threshold * context_window
  keep_recent: 4        # trailing messages kept verbatim mid-turn; PAIRS pre-turn
                        # ⚠️ the unit differs by path: pre-turn (WS//compact/SSE) reads
                        # this as PAIRS and pins 2x this many messages, mid-turn reads it
                        # as MESSAGES and halves it into pairs. 4 pins 8 messages on one
                        # path and 4 on the other. See docs/compaction.md.
  context_window: 256000 # fallback window when a provider has no context_window
  model: ""             # optional fast summary model; empty = active session model
                        # ⚠️ honoured PRE-TURN ONLY (WS//compact/SSE). Mid-turn
                        # compaction always summarises with the active session model,
                        # so setting this does not reduce mid-turn cost. See
                        # docs/compaction.md.
  chunk_threshold: 0.9  # carry-style chunking when summary input >= chunk_threshold * window
                        # ⚠️ CURRENTLY INERT: all three call sites hardcode 0.9
                        # (internal/llm/eino/compacting.go, internal/ctxcompact/compact.go x2).
                        # Setting another value changes nothing. See docs/compaction.md.
  cooldown_fraction: 0.05    # token-growth cooldown: 5% of window (MID-TURN ONLY)
  cooldown_duration: ""      # time-based cooldown (optional, e.g. "3s"); "" disables (MID-TURN ONLY)
  hard_force_fraction: 0.95  # force-compact near window edge even inside cooldown (MID-TURN ONLY)
# Per-turn agent stop conditions. EVERY field is off when zero and Load applies
# no defaults here — deliberately unlike `compaction:` above. A stop condition
# that turned itself on with a guessed default would cut turns short on an
# installation that never asked for a limit, and that failure looks exactly like
# the model giving up. The whole block below is therefore a no-op as written;
# uncomment the values you actually want.
loop_guard:
  repetition_enabled: false  # detect identical tool calls (name + arguments) repeating
  repetition_window: 0       # sliding window in tool calls; 0 = loopguard's default
  repetition_warn_after: 0   # consecutive repeats before the turn is nudged; 0 = default
  repetition_stop_after: 0   # consecutive repeats before the turn ends; 0 = default
                             # the three above are inert unless repetition_enabled is true.
                             # they are left at 0 rather than spelled out because the real
                             # values live in internal/loopguard (DefaultRepetitionWindow,
                             # DefaultRepetitionStages) — copying them here would create a
                             # second source of truth that drifts silently.
  max_tool_calls: 0          # total tool calls allowed in one turn; 0 = unlimited
  per_tool_calls: {}         # per-name caps, e.g. {shell_run: 20, agent_spawn: 3}
                             # a budget refusal reaches the model as a tool RESULT,
                             # not a Go error, so the turn can adapt instead of aborting
  turn_timeout: 0s           # wall-clock limit per turn, checked at ReAct iteration
                             # boundaries only — it bounds the loop, not a single tool
                             # call. Duration string ("90s", "5m"); 0s = unlimited
  max_turn_tokens: 0         # accumulated token spend per turn; 0 = unlimited
# Lifecycle hooks (W-F-02). External programs consulted around agent events.
# The zero block (what ships here, commented out) spawns nothing; once a hook
# IS configured its failures FAIL CLOSED — a hook that times out, crashes or
# emits unreadable output refuses that tool call (the turn itself survives).
# A hook can block a call, but it can never turn a guard denial into an
# allow: after a hook rewrites the arguments the permission guard re-judges
# the final arguments from scratch.
#
# pre_tool_use hooks run, in declaration order, before every tool call. Each
# receives one JSON value on stdin:
#   {"event":"pre_tool_use","tool":"fs_write","args":{...the call arguments...}}
# and must answer with one JSON value on stdout, then exit 0:
#   {"block":false}                                        # allow, say nothing
#   {"block":true,"reason":"why"}                          # refuse the call
#   {"block":false,"updated_input":{...}}                  # rewrite arguments
#   {"block":false,"additional_context":["..."]}           # context for the model
# Read ONE value from stdin — do not wait for EOF (the launcher's stdin close
# is a console teardown, not a half-close). Observe-only hooks MUST still
# print {"block":false}: empty output is a failure, not an abstention.
# program is an executable path, never a shell line; timeout is a duration
# string, 0 selects the 10s default.
# hooks:
#   pre_tool_use:
#     - program: /usr/local/bin/yanshi-hook-check
#       args: ["--strict"]
#       timeout: 5s
# Permission profiles. The MAP KEY is what selects a profile — there is no
# indirection through the `agents:` block above (agents[].profile has no
# production reader today; setting it changes nothing and warns about nothing).
# Two keys are actually looked up:
#   * "orchestrator" — the chat/TUI orchestrator reads this exact key. Absent,
#     it falls back to the built-in DefaultOrchestratorProfile.
#   * <worker name>  — the task API serves GET /api/v1/agent/profile?worker=<n>
#     by looking up key <n>. So the "coding" profile below reaches a worker
#     started as `agent-worker -name coding`, and nothing else. Unknown workers
#     get a fail-closed deny-all profile.
#
# shell.policy accepts exactly four values: "" (== "allowlist"), "allowlist",
# "deny", "denylist". There is NO "allow" — an unrestricted shell is a
# "denylist" with no patterns. An unrecognized value is rejected at startup,
# because at runtime it would be a STRUCTURAL HardDeny that not even yolo/auto
# can override.
#
# That startup check only looks at profiles whose shell.rules is EMPTY. A rules
# table takes the shell dimension over completely and the policy switch is
# never reached, so a stale policy sitting next to rules is inert and is left
# alone rather than made into a boot failure. Empty the rules table and the
# same value becomes live — and is rejected on that reload.
profiles:
  orchestrator:
    fs: { read: ["**"], write: [] }
    tools: { allow: ["*"] }
    # Empty or absent mcp.allow denies every mcp_<server>_<tool>, even though
    # tools.allow contains "*". Opt in per trusted server/tool.
    mcp: { allow: [] }
    shell: { policy: "deny" }
    net: { allow: false }
  # A coding agent: all tools, one MCP server, read/write the repo, an
  # allowlisted shell, and outbound network. Reached only by a task worker
  # named "coding" (see the note above the profiles block) — rename the key to
  # "orchestrator" if you want the chat session to run under it.
  coding:
    tools: { allow: ["*"] }
    # Example: permit only tools discovered from server "github".
    mcp:   { allow: ["mcp_github_*"] }
    fs:    { read: ["**"], write: ["**"] }
    # W-B-18: ADDITIONAL project metadata directory names refused for WRITES
    # even under write: ["**"]. Bare names, not globs — compared against every
    # segment of the resolved target, so ".git" also covers a submodule's. The
    # built-in set (.git .yanshi .agents .codex) cannot be shortened from here;
    # to permit one of these paths, name it LITERALLY in fs.write.
    # protected: [".myagent"]
    shell: { policy: "allowlist", patterns: ["git *", "go test", "go test *", "cargo test", "cargo test *", "npm test", "npm test *"] }
    net:   { allow: true, hosts: ["*"] }
    #
    # shell.rules is the structured alternative to policy/patterns above. When
    # rules is non-empty it REPLACES them: checkShell evaluates the rules and
    # returns, so policy and patterns are not consulted at all. Rules match on
    # program + argument prefix and can deny on a specific flag, which glob
    # patterns cannot express.
    #
    # Left commented out on purpose. A live deny rule refuses commands that
    # work today, and an operator should choose that deliberately.
    #
    # rules:
    #   # Order matters: the first matching rule wins, so put denials first.
    #   - id: no-real-e2e
    #     program: go
    #     prefix: ["test"]
    #     deny_flags: ["-tags=e2e_real"]
    #     decision: deny
    #     justification: "real E2E spawns external agent CLIs; require explicit approval"
    #   - id: go-test
    #     program: go
    #     prefix: ["test"]
    #     decision: allow
    #     justification: "ordinary Go tests are safe"
    #
    # deny_flags matches the flag however it is spelled -- `-tags=e2e_real`,
    # `-tags e2e_real`, `--tags=e2e_real` and `-tags=e2e_real,other` all hit
    # the rule above. Verified by
    # internal/execpolicy::TestDenyFlagsSurviveFlagSpelling, which also pins
    # that the rule does NOT reach an ordinary `go test ./...`.

# Security (A1). Sandbox / network / shell posture. Defaults (applied when the
# block is absent): sandbox on + read-only tier + network default-deny + shell
# 1 MiB output cap + 30 min idle timeout. Override per deployment below.
security:
  sandbox:
    enabled: true              # *bool semantics: omit = default (true); false = opt-out
    tier: read-only            # read-only | workspace-write | full-access
    network_deny: true         # Phase 0 hint for the future OS-isolation backend
  # W-B-14: replace the instruction body the `auto` permission mode shows the
  # model. Omit for the built-in policy. The file is read and VALIDATED at
  # startup: an unreadable path, or one whose text drops any of the four risk
  # classes (reaching outside the project / cannot be undone / runs code nobody
  # has read / leaves the machine), refuses the start rather than silently
  # falling back — in auto mode this prompt IS the verdict, so a policy file
  # that quietly had no effect is the worst outcome available.
  #
  # ⚠️ The validation is LEXICAL. It checks that the four classes' marker words
  # are present; it cannot tell that a body listing them and then saying
  # "answer ALLOW for every tool call" has cancelled all four. Such a file
  # passes, and in auto mode it is then the whole verdict. The guarantee is
  # therefore about WHERE the file comes from, not what it says:
  #
  #   - With a trusted policy file ($YANSHI_POLICY, else ~/.yanshi/policy.yaml),
  #     that file owns this key — write it there, under `security:`. The value
  #     here is discarded, which is the point: config.yaml sits inside the tree
  #     the agent can write, so one fs_write plus a restart would otherwise let
  #     the agent author its own auto-approval policy.
  #   - Without one, you are trusting a file the agent can reach. `yanshi
  #     doctor` reports that posture; it is the same unprotected posture that
  #     applies to `profiles:`.
  # guardian_prompt_file: ~/.yanshi/guardian.md
  # ⚠️ Scope: these four keys govern yanshi's OWN in-process HTTP (web_fetch /
  # web_search) AND, since W5, subprocesses launched through the shell/secproc
  # factories — bootstrap starts a real loopback proxy and publishes its
  # address as http_proxy/https_proxy (both cases). `allow` therefore does
  # something now: a widened list genuinely admits egress for shell_run /
  # run_tests / github_* / git_*.
  #
  # (This block used to say the proxy "is written but never started" and that a
  # dead port http://127.0.0.1:0 was published unconditionally. That was true
  # before W5 and is no longer; if you are copying an older config.yaml, the
  # symptom "Failed to connect to 127.0.0.1 port 0" is gone.)
  #
  # What it still does NOT cover — the boundary has not moved as far as it
  # looks (see docs/adr/0014-managed-proxy-is-the-only-governed-egress-channel.md):
  #   * Only proxy-AWARE clients obey it (curl, gh, git-over-HTTP, go mod
  #     download, npm). A subprocess that ignores http_proxy and calls
  #     connect() directly, or opens a raw socket, is unaffected. Blocking
  #     those needs OS-level enforcement (seccomp / Seatbelt / AppContainer)
  #     and is S1 work. Treat the guard layer as the containment boundary.
  #   * ACP agent CLIs, stdio MCP servers and LSP servers are spawned with the
  #     host environment: they get NO managed proxy and DO inherit whatever
  #     http_proxy/https_proxy the operator's shell had. If that upstream proxy
  #     is untrusted, those subprocesses route through it.
  #   * If the proxy fails to start, bootstrap prints
  #     "subprocess egress is UNFILTERED" on stderr and continues.
  network:
    default: deny              # deny-wins posture (see the scope note above)
    allow: []                  # glob host patterns admitted (e.g. "*.github.com")
    deny: []                   # glob host patterns always rejected (deny wins)
    allow_private: false       # admit loopback / RFC1918 / link-local (SSRF risk)
    # HTTPS inspection (W-B-17). OFF by default, and that default is itself a
    # load-bearing decision: with it off the managed proxy handles CONNECT as a
    # blind tunnel, exactly as ADR-0014 specified. Turning it on lets the proxy
    # decrypt tunnels from factory-launched subprocesses using a locally
    # generated root at ~/.yanshi/tls/ca.pem, which is published to those
    # children through SSL_CERT_FILE and friends. It is NOT installed into any
    # system trust store. Read docs/adr/0023-inspecting-proxy-trust-boundary.md
    # first — especially the table of which platforms and clients can bypass
    # it, and the note that a certificate-pinning child stops being able to
    # reach the network at all.
    inspect_https: false
    # Per-method rules inside an allowed host. Evaluated in order, first match
    # wins, and they can only NARROW a host the rules above admitted — a host
    # in `deny` is never reconsidered here.
    #
    # They apply to plain http:// through the proxy always, and to https ONLY
    # when inspect_https is on: nobody can read the method inside a blind
    # CONNECT tunnel. bootstrap says so on stderr if you configure rules
    # without inspection.
    methods: []
    # - host: registry.npmjs.org   # same pattern syntax as allow/deny
    #   methods: [GET, HEAD]       # empty list = every method
    #   action: allow              # "allow" or "deny"; there is no default
    # - host: registry.npmjs.org
    #   action: deny               # ... so publishing is refused
  shell:
    max_output_bytes: 1048576  # ring buffer cap per session (1 MiB)
    idle_timeout: 30m          # session reaped after this idle window
    # Cap on shell sessions holding a live OS process at once (W-B-22).
    # 0 = uncapped. Over the cap a start QUEUES rather than failing — the wait
    # is bounded by the calling tool's own deadline.
    max_concurrent: 0
    # Run the operator's login shell once at startup and layer the environment
    # it produces under every subprocess launch (W-B-21). Turn this on when
    # yanshi is started from a desktop launcher or a service manager and the
    # model reports "command not found" for tools that work in your terminal.
    #
    # OFF by default because it executes your startup files at boot. Capture
    # failure is never fatal: children then get yanshi's own environment.
    # Credentials the rc files export are stripped on the same path that
    # strips yanshi's own.
    capture_profile: false
    profile_shell: ""          # bash|zsh|sh|powershell; empty = $SHELL

# Batch C1: RLM fan-out, automation scheduling, and agent batch jobs.
# RLM needs a cheap provider (cost_class: cheap) for rlm_query fan-out.
batch:
  rlm_model: cheap-provider         # provider name (must have cost_class: cheap)
  rlm_max_concurrency: 16           # <= 16, clamped otherwise
  automation_tick_seconds: 60       # scheduler interval, default 60s if <= 0

# Batch B1: 受管子代理运行时。agent_start / analysis / workflow 拉起的子代理都
# 由同一个 registry manager 统一记账,所以并发上限是全局共享的。
subagents:
  limit: 10                            # 同时在跑的子代理上限,合法范围 1..20,0/缺省 = 10
  persistence_path: ~/.yanshi/subagents.v1.json  # 子代理登记表落盘位置(跨会话恢复)

# B2-LSP1: post-edit diagnostics. When enabled, yanshi queries language servers
# after fs_write/fs_edit/apply_patch and feeds the diagnostics back to the model.
# Servers not found in PATH are silently skipped (soft-degrade).
lsp:
  enabled: true            # edit后自动查语言服务器诊断回喂模型;false 关闭
  diag_timeout: "800ms"    # 单文件诊断等待上限
  languages: {}            # 覆盖/扩展语言表;空 = 用内置 {go: gopls, python: pyright-langserver}

# MCP (A3): MCP server connections. Tools are registered as
# mcp_<server>_<tool> and are deny-by-default (see profiles.mcp.allow).
# Transport can be "http" (streamable HTTP) or "stdio" (subprocess).
mcp:
  servers: {}
  # my-tools:
  #   enabled: true
  #   transport: http
  #   url: "http://localhost:3000/mcp"
  #   bearer: "${MCP_BEARER_TOKEN}"
  #   timeout: 30s
  #
  # OAuth 2.0（仅 HTTP transport）。省略 oauth 块 = 沿用 bearer（或不鉴权），
  # 与本字段出现之前的行为逐字节一致。
  #
  # grant: client_credentials（默认，省略即此值）—— 机器对机器，无浏览器环节，
  # 首次调用前自动取 token：
  # my-oauth-tools:
  #   enabled: true
  #   transport: http
  #   url: "https://mcp.example.com"
  #   oauth:
  #     token_url: "https://auth.example.com/oauth/token"
  #     client_id: "${MCP_CLIENT_ID}"
  #     client_secret: "${MCP_CLIENT_SECRET}"
  #     scopes: [read, write]
  #
  # grant: authorization_code —— 浏览器 + PKCE，需要额外的 authorization_url，
  # 并且必须先跑一次 `yanshi auth mcp-login <server>` 建立授权；token 之后自动
  # 刷新，无需再交互。刷新 token 存在 secrets 后端里（见下方 secrets 块），
  # 没配 secrets 后端时这一档会在启动时打印告警并禁用，其余 server 不受影响：
  # my-user-tools:
  #   enabled: true
  #   transport: http
  #   url: "https://mcp.example.com"
  #   oauth:
  #     grant: authorization_code
  #     token_url: "https://auth.example.com/oauth/token"
  #     authorization_url: "https://auth.example.com/oauth/authorize"
  #     client_id: "${MCP_CLIENT_ID}"
  #     scopes: [read, write]
  #
  # 每 server 工具 allow/deny（W-F-12）。按 server 自己的工具名（不带
  # mcp_<server>_ 前缀）过滤注册面，精确名或 `*` 通配；deny 压过 allow。
  # 空 tool_allow = 不过滤（与本字段出现之前逐字节一致）—— 真正的鉴权门
  # 仍是 profiles.mcp.allow 的 fail-closed 语义，这里只能收窄不能放宽：
  #   tool_allow: ["*"]
  #   tool_deny: ["deploy_prod"]

# MEM1 用户 memory:跨会话偏好笔记,启动时作为独立 suffix 注入 system prompt。
# 默认关闭;显式 enabled: true 后才会加载与注入。
# memory:
#   enabled: true
#   user_path: ~/.yanshi/memory.md      # 默认值
#   project_path: .yanshi/memory.md     # 默认值,相对工作区根
#   max_size: 32768                     # 32 KiB,0 = 默认

# C4 可观测性:结构化日志 + OpenTelemetry。日志默认 info/json 走 stderr;OTel
# 默认关闭,开启时 sample_ratio 缺省 1.0(全量采样)。
observability:
  log:
    level: info              # debug | info | warn | error
    format: json             # json | text
    # file: "/var/log/yanshi.log"  # 固定日志文件路径;空 = stderr(或 TUI 模式下的默认文件)
    # TUI 启动时默认把日志重定向到 ~/.yanshi/logs/yanshi.log,避免污染 alt-screen 渲染。
    # stderr_in_tui: true          # 调试 TUI 时设为 true,让日志留在 stderr
    # O1 日志轮转。日志文件是长跑进程唯一无界的资源——前面没有 logrotate(8) 的
    # 部署（工作站上的 `yanshi serve`、容器）会被它撑满卷，进而把数据库一起拖垮。
    # max_size_mb: 10        # 活动文件轮转阈值；0 = 默认 10 MiB；负数 = 从不轮转
    # max_backups: 5         # 保留几代；0 = 默认 5；负数 = 一代不留（轮转即截断）
  otel:
    enabled: false
    endpoint: "http://127.0.0.1:4318"  # OTLP/HTTP
    service_name: yanshi
    sample_ratio: 1.0

# OBS3 特性注册表。Strict=true 时未知 flag 名直接 error(防拼写);overrides
# 是 operator 种子值,覆盖 registry 内置 default。
#
# 内置的三个 flag（权威定义在 internal/features/features.go 的 DefaultSpecs；
# 名字与这里的对账由 internal/features::TestExampleConfigNamesEveryFlag 守住，
# 加了新 flag 而没写进这里会让测试变红):
#
#   observe.slog_trace_id   stable, 默认 true
#     日志与 OTel span 上的关联 ID(trace_id / session_id / turn_id)。
#     关掉是**整轮**关掉:编排器本来会给缺 ID 的一轮补铸一套,所以关闭走的是
#     单向抑制,下游工具审计以外的地方都不会再冒出 ID。
#     注意 tools.ThreadLink 是另一条通道,喂的是工具审计记录,不受此开关影响 ——
#     把一个日志偏好变成问责缺口不是这个开关该干的事。
#
#   observe.otel_export     experimental, 默认 false
#     与上面 observability.otel.enabled 取**与**:两个都为真才导出。
#
#   observe.cost_in_status  beta, 默认 true
#     status 帧、会话列表(/stats 渲染它)与 session_restored 上的 USD 成本字段。
#     关掉只影响**显示**:入库的账本照记,开回来能看到完整历史。
#
#   memory_distill_after_turn  experimental, 默认 false(A2/W-A-05)
#     每个 turn 结束后在后台自动跑一次记忆蒸馏(合并冗余的历史记忆行)。默认关闭:
#     交互式的 /distill 斜杠命令是主入口,这个开关只是把同一条通道接成自动的。
#     蒸馏用的模型优先取 batch.rlm_model 配置的便宜 provider,未配置则退回主
#     聊天模型;蒸馏失败只记日志,不影响所在 turn 的正常结束。
#
# 运行时还能用 TUI 的 /features 临时切换(不落盘)。
features:
  strict: false
  overrides: {}

# COST1 模型单价表覆盖。键为模型名,值为 USD per million tokens。
# bootstrap 把这些转成 einollm.ModelPricing 注入价格表;未知模型走 N/A。
# COST1 每模型价格。内置表**只覆盖 claude-***（来源见 internal/llm/eino/pricing.go
# 的包头，含抓取日期）。用别家 provider 时 /status 与 /stats 的成本会显示 N/A ——
# 那是诚实的"没有价格数据"，不是坏了。
#
# 为什么不内置别家的价目：一张写死在代码里的第三方价目表会安静地腐烂，而腐烂后的
# 症状比 N/A 糟得多 —— 用户看到一个像模像样的数字，没有任何迹象表明它是按去年的
# 单价算的。N/A 会让人去查，错的数字不会。
#
# 单价按**每百万 token** 计。cache_hit_per_m 省略则回落到 input_per_m。
# pricing:
#   overrides:
#     gpt-4o:
#       input_per_m: 2.50
#       cache_hit_per_m: 1.25
#       output_per_m: 10.00
pricing:
  overrides: {}

# D3-S10 安全凭据存储。**只存 RFC 8628 device-flow token** —— provider 的
# api_key 不走这里(见上方 llm.providers,写字面量或 ${VAR})。
# auto = 优先 OS keyring (zalando/go-keyring),失败软降级到加密文件
# (Argon2id + AES-256-GCM);keyring = 强制 OS keyring;file = 强制加密文件;
# none = 关闭密钥存储(device flow 无法保存 token)。
# file_path 为空 => os.UserConfigDir()/yanshi/secrets.enc
# passphrase_env 为空且 backend=auto 时,fileStore 被跳过。
secrets:
  backend: auto
  file_path: ""
  passphrase_env: YANSHI_PASSPHRASE

# D3-O03 provider-neutral 认证。只配置 RFC 8628 device authorization;启用
# 前必须用 HTTPS-only 的 device_url/token_url(loopback HTTP 仅供 e2e 测试)。
# api_key 不在这里管 —— 它在 llm.providers[].api_key 里写死或用 ${VAR}。
auth:
  device:
    device_auth_enabled: false
    client_id: ""
    providers: []

# D3-I18N1 国际化。ui_locale=auto 时每次启动按 LC_ALL > LANG 重算(不持久化);
# output_language 独立控制模型回复语言,空字符串表示不注入 system-prompt 指令。
i18n:
  ui_locale: auto
  output_language: ""

# D3-C15 TUI 键位/主题偏好。bindings 的方向固定为 key: action(与 keymap
# 内置 builder 一致)。
#
# 接线现状(照抄本文件建 config.yaml 前先读这段):本块字段自 W8 起经
# cmd/yanshi/main.go 读入 tui.Preferences 项目层(flags > env > user >
# project 四层稀疏层级中的最低一层,defaults 是这四层之下的基线而不是第五层
# —— 见 internal/cli/tui/preferences.go 的 mergeTUIPrefs),同时 `yanshi doctor`
# (checkKeymapConfig / checkHighContrastConfig)仍会独立校验并在体检报告
# 中复述同一批键。两条消费路径都是真的。vim/high_contrast/frecency/notify
# 是 *bool,省略与显式 false 在配置层可区分。权威说明见
# internal/config.TUIConfig 的 doc 注释。
tui:
  keymap: default
  theme: default
  vim: false
  high_contrast: false
  # UX4：@path 补全的「最近用过的文件排前面」排序。默认 true。
  # 设为 false **同时**停掉排序与记录 —— 关掉这个功能的人要的不是一份安静
  # 一点的文件使用画像。存储位置与 prefs.json 同目录（全局单文件），项目隔离
  # 是读取时按 work root 过滤，不是每项目一个文件。
  frecency: true
  # W-E-04：任务结束时的桌面通知（能力受支持的终端用 OSC 9，TERM=dumb 这类
  # 降级为纯 BEL 响铃，不支持时保持静默）。默认 false —— 与 frecency 的默认
  # 相反：一个默认就对着桌面弹通知的 agent 是本批次明确要避免的「烦人默认值」。
  notify: false
  bindings:
    enter: send
    ctrl+enter: newline

# 自驱动目标循环（yanshi goal）的预算。两项都是 0 = 不限。
#
# 显式传入的命令行 flag 永远优先，包括显式传 0 —— `-max-tokens 0` 是「这一次
# 解除限制」的意思，不会被这里的值悄悄恢复。
#
# max_tokens 只能约束真的上报 token 用量的 agent。不上报的 agent 是无法计量的
# （goalloop 检测到会打 warn），对它生效的是 max_iterations。
goal:
  max_tokens: 0
  max_iterations: 0
