# schema_version is the config schema generation. Omit on existing configs to
# keep them forward-compatible (treated as the current version). yanshi rejects
# a value higher than it supports — upgrade yanshi first. See
# docs/upgrade-guide.md.
schema_version: 1
server:
  http_addr: "127.0.0.1:8080"
  task_addr: "127.0.0.1:8081"
storage:
  sqlite_path: "yanshi.db"
  wal_max_open_conns: 4       # F1: read pool size (1=legacy serial, 4+ for concurrent reads)
  busy_timeout_ms: 5000       # F1: cross-process lock retry window (ms)
  wal_auto_checkpoint: 1000   # F1: WAL auto-checkpoint page threshold
token: "change-me"
llm:
  providers:
    - name: "openai"
      kind: "openai"
      model: "gpt-4o"
      api_key: "${OPENAI_API_KEY}"
      context_window: 128000      # this model's token window; compaction sizes against it
      # multimodal: true          # native image input; auto-selects as vision auxiliary (Tier G)
    - name: "claude"
      kind: "anthropic"
      model: "claude-opus-4-8"
      api_key: "${ANTHROPIC_API_KEY}"
      context_window: 200000
      multimodal: true            # native image input (Tier G)
agents:
  - name: "orchestrator"
    type: "local"
    chain: ["openai", "claude"]
    profile: "orchestrator"
    capabilities: []
skills:
  builtin_dir: ./skills
  user_dir: ~/.yanshi/skills
  plugin_dir: ~/.yanshi/plugins
vcs:
  ignore: ["coverage", ".cache"]          # extra ignore patterns (merged with defaults)
  worktree_dir: "~/.yanshi/worktrees"   # where worktree working dirs live
compaction:
  threshold: 0.8        # compact when est. tokens >= threshold * context_window
  keep_recent: 4        # trailing messages kept verbatim mid-turn; PAIRS pre-turn
                        # ⚠️ the unit differs by path: pre-turn (WS//compact/SSE) reads
                        # this as PAIRS and pins 2x this many messages, mid-turn reads it
                        # as MESSAGES and halves it into pairs. 4 pins 8 messages on one
                        # path and 4 on the other. See docs/compaction.md.
  context_window: 256000 # fallback window when a provider has no context_window
  model: ""             # optional fast summary model; empty = active session model
                        # ⚠️ honoured PRE-TURN ONLY (WS//compact/SSE). Mid-turn
                        # compaction always summarises with the active session model,
                        # so setting this does not reduce mid-turn cost. See
                        # docs/compaction.md.
  chunk_threshold: 0.9  # carry-style chunking when summary input >= chunk_threshold * window
                        # ⚠️ CURRENTLY INERT: all three call sites hardcode 0.9
                        # (internal/llm/eino/compacting.go, internal/ctxcompact/compact.go x2).
                        # Setting another value changes nothing. See docs/compaction.md.
  cooldown_fraction: 0.05    # token-growth cooldown: 5% of window (MID-TURN ONLY)
  cooldown_duration: ""      # time-based cooldown (optional, e.g. "3s"); "" disables (MID-TURN ONLY)
  hard_force_fraction: 0.95  # force-compact near window edge even inside cooldown (MID-TURN ONLY)
# Permission profiles. The MAP KEY is what selects a profile — there is no
# indirection through the `agents:` block above (agents[].profile has no
# production reader today; setting it changes nothing and warns about nothing).
# Two keys are actually looked up:
#   * "orchestrator" — the chat/TUI orchestrator reads this exact key. Absent,
#     it falls back to the built-in DefaultOrchestratorProfile.
#   * <worker name>  — the task API serves GET /api/v1/agent/profile?worker=<n>
#     by looking up key <n>. So the "coding" profile below reaches a worker
#     started as `agent-worker -name coding`, and nothing else. Unknown workers
#     get a fail-closed deny-all profile.
#
# shell.policy accepts exactly four values: "" (== "allowlist"), "allowlist",
# "deny", "denylist". There is NO "allow" — an unrestricted shell is a
# "denylist" with no patterns. An unrecognized value is rejected at startup,
# because at runtime it would be a STRUCTURAL HardDeny that not even yolo/auto
# can override.
#
# That startup check only looks at profiles whose shell.rules is EMPTY. A rules
# table takes the shell dimension over completely and the policy switch is
# never reached, so a stale policy sitting next to rules is inert and is left
# alone rather than made into a boot failure. Empty the rules table and the
# same value becomes live — and is rejected on that reload.
profiles:
  orchestrator:
    fs: { read: ["**"], write: [] }
    tools: { allow: ["*"] }
    # Empty or absent mcp.allow denies every mcp_<server>_<tool>, even though
    # tools.allow contains "*". Opt in per trusted server/tool.
    mcp: { allow: [] }
    shell: { policy: "deny" }
    net: { allow: false }
  # A coding agent: all tools, one MCP server, read/write the repo, an
  # allowlisted shell, and outbound network. Reached only by a task worker
  # named "coding" (see the note above the profiles block) — rename the key to
  # "orchestrator" if you want the chat session to run under it.
  coding:
    tools: { allow: ["*"] }
    # Example: permit only tools discovered from server "github".
    mcp:   { allow: ["mcp_github_*"] }
    fs:    { read: ["**"], write: ["**"] }
    shell: { policy: "allowlist", patterns: ["git *", "go test", "go test *", "cargo test", "cargo test *", "npm test", "npm test *"] }
    net:   { allow: true, hosts: ["*"] }
    #
    # shell.rules is the structured alternative to policy/patterns above. When
    # rules is non-empty it REPLACES them: checkShell evaluates the rules and
    # returns, so policy and patterns are not consulted at all. Rules match on
    # program + argument prefix and can deny on a specific flag, which glob
    # patterns cannot express.
    #
    # Left commented out on purpose. A live deny rule refuses commands that
    # work today, and an operator should choose that deliberately.
    #
    # rules:
    #   # Order matters: the first matching rule wins, so put denials first.
    #   - id: no-real-e2e
    #     program: go
    #     prefix: ["test"]
    #     deny_flags: ["-tags=e2e_real"]
    #     decision: deny
    #     justification: "real E2E spawns external agent CLIs; require explicit approval"
    #   - id: go-test
    #     program: go
    #     prefix: ["test"]
    #     decision: allow
    #     justification: "ordinary Go tests are safe"
    #
    # deny_flags matches the flag however it is spelled -- `-tags=e2e_real`,
    # `-tags e2e_real`, `--tags=e2e_real` and `-tags=e2e_real,other` all hit
    # the rule above. Verified by
    # internal/execpolicy::TestDenyFlagsSurviveFlagSpelling, which also pins
    # that the rule does NOT reach an ordinary `go test ./...`.

# Security (A1). Sandbox / network / shell posture. Defaults (applied when the
# block is absent): sandbox on + read-only tier + network default-deny + shell
# 1 MiB output cap + 30 min idle timeout. Override per deployment below.
security:
  sandbox:
    enabled: true              # *bool semantics: omit = default (true); false = opt-out
    tier: read-only            # read-only | workspace-write | full-access
    network_deny: true         # Phase 0 hint for the future OS-isolation backend
  # ⚠️ Scope: these four keys govern yanshi's OWN in-process HTTP (web_fetch /
  # web_search) AND, since W5, subprocesses launched through the shell/secproc
  # factories — bootstrap starts a real loopback proxy and publishes its
  # address as http_proxy/https_proxy (both cases). `allow` therefore does
  # something now: a widened list genuinely admits egress for shell_run /
  # run_tests / github_* / git_*.
  #
  # (This block used to say the proxy "is written but never started" and that a
  # dead port http://127.0.0.1:0 was published unconditionally. That was true
  # before W5 and is no longer; if you are copying an older config.yaml, the
  # symptom "Failed to connect to 127.0.0.1 port 0" is gone.)
  #
  # What it still does NOT cover — the boundary has not moved as far as it
  # looks (see docs/adr/0014-managed-proxy-is-the-only-governed-egress-channel.md):
  #   * Only proxy-AWARE clients obey it (curl, gh, git-over-HTTP, go mod
  #     download, npm). A subprocess that ignores http_proxy and calls
  #     connect() directly, or opens a raw socket, is unaffected. Blocking
  #     those needs OS-level enforcement (seccomp / Seatbelt / AppContainer)
  #     and is S1 work. Treat the guard layer as the containment boundary.
  #   * ACP agent CLIs, stdio MCP servers and LSP servers are spawned with the
  #     host environment: they get NO managed proxy and DO inherit whatever
  #     http_proxy/https_proxy the operator's shell had. If that upstream proxy
  #     is untrusted, those subprocesses route through it.
  #   * If the proxy fails to start, bootstrap prints
  #     "subprocess egress is UNFILTERED" on stderr and continues.
  network:
    default: deny              # deny-wins posture (see the scope note above)
    allow: []                  # glob host patterns admitted (e.g. "*.github.com")
    deny: []                   # glob host patterns always rejected (deny wins)
    allow_private: false       # admit loopback / RFC1918 / link-local (SSRF risk)
  shell:
    max_output_bytes: 1048576  # ring buffer cap per session (1 MiB)
    idle_timeout: 30m          # session reaped after this idle window

# Batch C1: RLM fan-out, automation scheduling, and agent batch jobs.
# RLM needs a cheap provider (cost_class: cheap) for rlm_query fan-out.
batch:
  rlm_model: cheap-provider         # provider name (must have cost_class: cheap)
  rlm_max_concurrency: 16           # <= 16, clamped otherwise
  automation_tick_seconds: 60       # scheduler interval, default 60s if <= 0

# Batch B1: 受管子代理运行时。agent_start / analysis / workflow 拉起的子代理都
# 由同一个 registry manager 统一记账,所以并发上限是全局共享的。
subagents:
  limit: 10                            # 同时在跑的子代理上限,合法范围 1..20,0/缺省 = 10
  persistence_path: ~/.yanshi/subagents.v1.json  # 子代理登记表落盘位置(跨会话恢复)

# B2-LSP1: post-edit diagnostics. When enabled, yanshi queries language servers
# after fs_write/fs_edit/apply_patch and feeds the diagnostics back to the model.
# Servers not found in PATH are silently skipped (soft-degrade).
lsp:
  enabled: true            # edit后自动查语言服务器诊断回喂模型;false 关闭
  diag_timeout: "800ms"    # 单文件诊断等待上限
  languages: {}            # 覆盖/扩展语言表;空 = 用内置 {go: gopls, python: pyright-langserver}

# MCP (A3): MCP server connections. Tools are registered as
# mcp_<server>_<tool> and are deny-by-default (see profiles.mcp.allow).
# Transport can be "http" (streamable HTTP) or "stdio" (subprocess).
mcp:
  servers: {}
  # my-tools:
  #   enabled: true
  #   transport: http
  #   url: "http://localhost:3000/mcp"
  #   bearer: "${MCP_BEARER_TOKEN}"
  #   timeout: 30s

# MEM1 用户 memory:跨会话偏好笔记,启动时作为独立 suffix 注入 system prompt。
# 默认关闭;显式 enabled: true 后才会加载与注入。
# memory:
#   enabled: true
#   user_path: ~/.yanshi/memory.md      # 默认值
#   project_path: .yanshi/memory.md     # 默认值,相对工作区根
#   max_size: 32768                     # 32 KiB,0 = 默认

# C4 可观测性:结构化日志 + OpenTelemetry。日志默认 info/json 走 stderr;OTel
# 默认关闭,开启时 sample_ratio 缺省 1.0(全量采样)。
observability:
  log:
    level: info              # debug | info | warn | error
    format: json             # json | text
    # file: "/var/log/yanshi.log"  # 固定日志文件路径;空 = stderr(或 TUI 模式下的默认文件)
    # TUI 启动时默认把日志重定向到 ~/.yanshi/logs/yanshi.log,避免污染 alt-screen 渲染。
    # stderr_in_tui: true          # 调试 TUI 时设为 true,让日志留在 stderr
  otel:
    enabled: false
    endpoint: "http://127.0.0.1:4318"  # OTLP/HTTP
    service_name: yanshi
    sample_ratio: 1.0

# OBS3 特性注册表。Strict=true 时未知 flag 名直接 error(防拼写);overrides
# 是 operator 种子值,覆盖 registry 内置 default。
features:
  strict: false
  overrides: {}

# COST1 模型单价表覆盖。键为模型名,值为 USD per million tokens。
# bootstrap 把这些转成 einollm.ModelPricing 注入价格表;未知模型走 N/A。
pricing:
  overrides: {}

# D3-S10 安全凭据存储。auto = 优先 OS keyring (zalando/go-keyring),失败软降级
# 到加密文件 (Argon2id + AES-256-GCM);keyring = 强制 OS keyring;file = 强制
# 加密文件;none = 关闭密钥存储(secret:// 引用解析失败)。
# file_path 为空 => os.UserConfigDir()/yanshi/secrets.enc
# passphrase_env 为空且 backend=auto 时,fileStore 被跳过(env/legacy 仍可用)。
secrets:
  backend: auto
  file_path: ""
  passphrase_env: YANSHI_PASSPHRASE

# D3-O03 provider-neutral 认证。legacy_insecure=true 时接受配置里的明文 API key
# (默认 false,fail-closed)。device 块配置 RFC 8628 device authorization;启用
# 前必须用 HTTPS-only 的 device_url/token_url(loopback HTTP 仅供 e2e 测试)。
auth:
  # LegacyInsecure accepts raw literal API keys in config.yaml.
  # This bypasses S10's fail-closed threat model — only enable temporarily
  # during migration.
  legacy_insecure: false

  # AutoMigrate automatically stores raw literal API keys into the secrets
  # backend and rewrites config.yaml with secret:// references on first boot.
  # The rewrite is best-effort: if config.yaml is unwritable, boot proceeds
  # with the ref in memory but prints a warning. Default: false.
  auto_migrate: false

  device:
    device_auth_enabled: false
    client_id: ""
    providers: []

# D3-I18N1 国际化。ui_locale=auto 时每次启动按 LC_ALL > LANG 重算(不持久化);
# output_language 独立控制模型回复语言,空字符串表示不注入 system-prompt 指令。
i18n:
  ui_locale: auto
  output_language: ""

# D3-C15 TUI 键位/主题偏好。bindings 的方向固定为 key: action(与 keymap
# 内置 builder 一致)。
#
# 接线现状(照抄本文件建 config.yaml 前先读这段):本块四个键当前只被
# `yanshi doctor` 消费(internal/cli/doctor.go 的 checkKeymapConfig /
# checkHighContrastConfig),TUI 不读它们——主题与键位都是硬编码默认值;
# 没有任何运行时命令回写它们,也不加载任何 preferences 文件。也就是说:
# 这几个键会被校验和体检报告,但不会被应用。vim/high_contrast 是 *bool,
# 省略与显式 false 在配置层可区分,但目前两者的运行时效果相同(都不生效)。
# 权威说明见 internal/config.TUIConfig 的 doc 注释。
tui:
  keymap: default
  theme: default
  vim: false
  high_contrast: false
  bindings:
    enter: send
    ctrl+enter: newline

# 自驱动目标循环（yanshi goal）的预算。两项都是 0 = 不限。
#
# 显式传入的命令行 flag 永远优先，包括显式传 0 —— `-max-tokens 0` 是「这一次
# 解除限制」的意思，不会被这里的值悄悄恢复。
#
# max_tokens 只能约束真的上报 token 用量的 agent。不上报的 agent 是无法计量的
# （goalloop 检测到会打 warn），对它生效的是 max_iterations。
goal:
  max_tokens: 0
  max_iterations: 0
