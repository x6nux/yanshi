[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yanshi-sdk"
version = "0.1.0"
description = "Typed Python client for the Yanshi Agent API v1"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "websockets>=13,<16",
  "pydantic>=2.8,<3"
]

[project.optional-dependencies]
test = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.23,<1",
  "jsonschema>=4.23,<5",
  "websockets>=13,<16"
]
# Packaging tools for `python -m build` / `python -m twine check`.
#
# Renamed from "generate", which also pinned datamodel-code-generator — a code
# generator no script ever invoked. The models in generated.py are, and have
# always said they are, a hand-maintained mirror; internal/api/v1's parity test
# is what compares them to the other three statements of the contract. A pinned
# dependency for a generator that does not run reads like the models are
# generated.
publish = [
  "build>=1.2,<2",
  "twine>=5.1,<6"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-q"
testpaths = ["tests"]
