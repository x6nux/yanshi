# W1/Task 2：BuildRLM 失败曾让整个 BuildC1 返回 error，于是没配 batch.rlm_model 的
# 部署连带丢掉八个 automation 工具与 agent_batch。改为软降级（RLM 置 nil + Warnings），
# 与 VCS 初始化、插件发现相同的非致命启动失败处理方式。
# 2026-08-04 复核：done → partial。原 evidence
# （internal/bootstrap::TestBuildC1RLMDegradesWithoutModel）断言的是
# components.RLM == nil，即 rlm_query 压根没被构造 —— 与四条验收无一对应。
# 换成真实覆盖的测试后逐条结论：
#   1 1-16 并发 —— 覆盖（>16 被拒）
#   2 顺序对应 —— 覆盖
#   3 cap 生效 —— 覆盖
#   4 成本显著低于 sub-agent ——【缺】无任何度量。SelectRLMModel 强制
#     cost_class=cheap 只是「声明便宜」，不是「实测更便宜」；没有任何测试或
#     基准比较 rlm_query 与 agent_spawn 的 token / 费用。这一条不达标，
#     故整条保持 partial（与 B1/M04b、G/VISION-TOOL、A1/T07/T08 同一把尺子）。
  # 2026-08-07：partial → done。子句 4 拆解定性为「N 类：测量不是断言」，按它给出的
  # 可承载改写落地 —— **不改 acceptance 文本**，因为「成本显著低于 sub-agent」本身
  # 就能被行为化：比较同一批任务下两条路径**实际发给 provider 的量**。
  #   · rlm_query 每项发一条裸 prompt；
  #   · 每项一个 sub-agent 则每次调用都带上继承的 system instruction
  #     （AGENT.md/CLAUDE.md + 输出契约），而且 ReAct 循环每项可能不止一次调用。
  # 差异是**结构性**的而非「选了哪个便宜模型」的性质，这正是它可断言的原因 ——
  # SelectRLMModel 强制 cost_class=cheap 只说明模型便宜，没说**这条路**更便宜。
  # 实测（8 项）：rlm 8 次调用 / 320 字符，sub-agent 路径 8 次调用 / 15408 字符。
  # 断言写成比值且倍数刻意放松（子句说的是「显著」，钉死一个精确数字会被任何
  # prompt 改动打红）。度量用字符而非 token：分词是 provider 相关的，而任何分词器
  # 对输入长度都是单调的，所以「发了几倍的文本」就是「贵了几倍」。
  # 变异验过：让 rlm 也带上同一段 system instruction → 红。
