# yanshi 功能状态台账 — S0 的单一真相源。
#
# 本文件取代 docs/feature-status-audit.md 作为当前状态依据；审计文档降级为
# 2026-07-31 的历史快照。63 项 = 审计 64 项 - A1/S08（已移出至 S1，见
# docs/superpowers/specs/2026-08-03-yanshi-roadmap-design.md §4.1）。
#
# verdict: partial | missing | divergent | done | removed
#   done / removed 是两档终态，都计入「S0 完成」。
# evidence:
#   非终态条目可以留空，也可以写一条线索引用（当前有几条这样写，用
#   `go test ./internal/archtest -run TestFeatureStatusLedgerProgress -v` 重数，
#   不要在这里写死数字 —— 写死过一次，七条 partial 加线索的那次提交就把它改漂了）。线索
#   必须解析得开，否则 GOV8 变红 —— 但它只是「查到哪儿了」，不代表覆盖，因此非终态
#   不接受子句映射写法。
#   终态（done / removed）条目必须写成「验收子句号 -> 证据」的映射，acceptance 按
#   「；」/「;」切成 N 条子句，evidence 的 key 必须恰好是 1..N —— 少一条 = 有承诺没
#   兑现，多一条 = 引用了已不存在的子句。两者都会让 GOV8 变红。
#
#     evidence:
#       "1": "internal/foo::TestA"
#       "2": "internal/foo::TestB; internal/bar::TestC"   # 一条子句可以要多个测试
#
#   终态证据只接受**测试引用**（包路径::测试名，不是文件路径）：终态断言的是行为，
#   只有可执行断言能承载这种主张，文件引用只能证明文件存在。
#
#   ⚠️ 双向握手：被引用的测试必须在自己的 doc 注释里回写一行
#       ledger: <条目 ID>#<子句号> <子句原文>
#   否则 GOV8 红。这条是防「凑数」的关键 —— 想用不相关的测试顶一条验收，就必须
#   到那个测试体正上方把「本测试证明 <子句>」写下来，谎言被迫落在最容易被拆穿的
#   位置。反向扫描同时禁止过期标记：测试声称的子句若已不被台账引用，同样红。
#   规则实现见 internal/archtest/status_evidence_test.go。
#
# 翻牌前先查表：docs/superpowers/acceptance-breakdown.md 把这 63 条的 230 条子句
#   全部拆开了，逐句标注「证据形状 / 当前状态 / 归属工作包」。它不是门禁，是门禁的
#   输入 —— 七轮评审里回退过的每一条都是「满足第 1 句就翻 done」，根因是子句从未被
#   显式拆开、每次翻牌都要临时重新切分。查表，不要重新推理。

