# 2026-08-04 复核：done → partial。理由与 C1/AU1 那次退回逐字相同 ——「掏空后测试
# 仍 PASS」。前一次复核（见本条历史）把 8 个 TestProperty_* 当成覆盖面的证据，但只
# 数了测试个数，没有对每条被引测试做变异测试。实测三次掏空（go test -overlay，工作
# 树零写入）：
#   ① Run 掏空成恒等（永不 summarize，原样返回）→ PinSetIsSubsetOfOutput /
#      RunReducesTokens / EachSummaryCallWithinWindow 全 PASS
#   ② Plan 掏空成 &PlanResult{} → PinSetIsSubsetOfOutput 的 50 个 trial 全部执行
#      （51 行 === RUN、零 --- SKIP）且全部 PASS
#   ③ RunSummary 掏空成恒返回 error → EachSummaryCallWithinWindow PASS，
#      只多了 4 行 t.Logf
# 三处根因是同一种：前置条件守卫读被测代码自己的产物（run_property_test.go 的
# `&& len(rs.GenerateCalls)+... > 0`、plan_property_test.go 的
# `if len(plan.SummarizeIndices) == 0 { return }`），以及 summarize_property_test.go
# 的 `if err != nil { t.Logf; return }` 吞错。第 3 句的三条配对测试不在此列（它们走
# 执行率下限的那条路径），但 GOV8 是逐句握手，第 1、2 句无效即整条不能是终态。
#
# 2026-08-04 同日修复后：partial → done。三处守卫都换掉了，并用同样的三次掏空
# 复验，全部由 PASS 转 FAIL：
#   ① Run 掏空成恒等 → RunReducesTokens FAIL
#      「only 0/30 trials summarized anything (need ≥18)」
#   ② Plan 掏空成 &PlanResult{} → PinSetIsSubsetOfOutput FAIL
#      「only 0/50 trials reached Assemble (need ≥30)」，RunReducesTokens 同时 FAIL
#   ③ RunSummary 掏空成恒返回 error → EachSummaryCallWithinWindow FAIL
#      「RunSummary failed for a reason this property does not tolerate」
#   ③b RunSummary 掏空成恒返回被容忍的 ErrNoWindowRoom（绕开 ③ 的那条路）→ 仍 FAIL
#      「only 0 of 4 windows produced summarizer calls (want ≥3)」
#   ④ 第 3 句独立复验：EnforceToolCallPairs 掏空成 no-op → 三条配对测试全 FAIL
# 手法：go test -overlay，掏空只存在于 /tmp 的副本里，工作树零写入。
# 修法：所有生成型属性统一走 runGeneratedProperty（守卫只读生成输入 + 60% 执行率
# 下限），「这一趟真的压缩了吗」这类只能由被测代码回答的内层前提改成计数 +
# requireTrialFloor（掏空使计数归零即变红），RunSummary 的可容忍失败收敛成一个
# 哨兵 ErrNoWindowRoom（其余错误一律 t.Fatal）。
# 遗留弱点（与上一版相同，不足以推翻 done）：属性生成器用固定种子（propSeed=42 等）
# 而非每次运行换种子 —— 覆盖面来自 trial 数而不是跨运行的随机性。这是有意的
# （CI 可复现），但新 bug 只有落在这批种子的轨迹上才会被抓到。
