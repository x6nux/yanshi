#   CappedBackoff:100ms，
# 即**行数超过 registry cap（默认 10）的批任务必然每行空转 5s 后失败**。
# 原 evidence 里的 internal/agent/batch::TestRunnerSpawnCapExhausted 不是「限并发
# 生效」的证据，而是这个泄漏的**目击者**：cap=1 / 2 行，第 0 行已完成，第 1 行仍被
# 判超限。另注意 internal/agent/batch::TestRunnerCapsAtRegistryMaxConcurrent 名不
# 副实（3 行 / cap 4，从不触发上限），同样不能当第 2 条的证据。
# ⚠️ 修复归 W3（= W3 计划里的 F2/LEAK2「槽位泄漏」），本条只做台账诚实性，不在
#    W1 的工作面上动 registry。
  # 2026-08-07：partial → done。上面那段「槽位泄漏 → 限并发不成立」的诊断**已经
  # 过时** —— W3 修掉了它：finishTerminal 现在在同一个临界区里调 detachRuntime
  # （internal/agent/registry/manager.go），完成路径确实 delete 了 runtime 条目。
  # 缺的只剩一条**正面**证据，而既有两条都给不出：
  #   · TestRunnerCapsAtRegistryMaxConcurrent —— 3 行 / cap 4，**从不触及上限**，
  #     名字描述了一件它的 body 产生不出来的事。
  #   · TestRunnerSpawnCapExhausted —— 反过来：占位者永不返回，钉住的是「行被拒」，
  #     不是「行被**暂时**拒」。
  # 这个区分就是整条子句：一个从不释放槽位的 cap 是**终身 spawn 预算**，也正是
  # 泄漏修好之前的样子（长于 cap 的批任务逐行耗尽重试后失败）。新证据两半同时钉：
  # 并发峰值不超过 cap（否则没有 cap），且每一行最终都完成（否则 cap 是预算）。
  # 峰值在 spawn 函数**内部**采样 —— 事后数 spawn 次数分不出顺序执行与并发执行；
  # 并带正对照（峰值必须 > 1，否则「没超过 cap」对一个完全串行的 runner 也成立）。
  # 双向变异都验过：摘掉 detachRuntime → 行失败；runningLocked 恒 0 → 峰值 6。
