  # W6/Task 11：分组头永远被滤掉 —— 过滤器把分组头也当匹配候选跑
  # HasPrefix(name, prefix)，而 "── files ──" 不可能以用户键入的前缀开头，于是
  # MCP 工具排成无分组的平铺列表（internal/cli/tui::TestPaletteKeepsMCPGroupHeaders）。
  # 更根本的是数据源从不被触发：paletteMCPServers 只由 /mcp 的回复填充，而如果
  # palette 正是发现工具的地方，用户就没有理由去敲 /mcp。已改为启动时请求。
  # 两条缺陷叠加时单独修任一条都测不出效果。
  # 2026-08-07：partial → done。
  #   1 既有 TestPaletteKeepsMCPGroupHeaders 只证明分组头没被过滤掉，不证明它
  #     「分组」：每个头后面跟着别的 server 的工具、或者头文本是个常量，它都绿。
  #     补的判据是**相邻性**（同一 server 的工具连续且在自己的头下面）与**派生性**
  #     （头带 server 名而不是固定串）。
  #   2 【新实现】此前 failed server 的工具与正常工具**完全无法区分**：没有标记、
  #     选中照样把名字贴进输入框，而那次调用会以「unknown tool」回来，操作员无从
  #     把失败连回那一行。加 command.disabled，渲染带**纯文本**标记（只靠颜色在
