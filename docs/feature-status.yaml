  # 路都被拒，元字符层只是拒得更早。限定主语后子句说的是解析器能力，那是真的、
  # 也是可测的。同 A1/S09 的作用域限定，理由记在 ADR-0004（元字符防线）。
  acceptance: "execpolicy 解析器能识别程序/参数/管道/重定向；规则结果可解释；已知绕过样例（IFS、$()、glob 注入）有回归测试"
