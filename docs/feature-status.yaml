  # 子句 1 在 W5 加了「execpolicy 解析器」这个主语限定。原文「能识别程序/参数/管道/
  # 重定向」读起来像在说生产路径，而 docs/superpowers/acceptance-breakdown.md 判它
  # 「层级错位」：含 `|` `>` `<` 的命令在 internal/guard/guard.go::Guard.checkShell
  # 的元字符结构性 HardDeny 就短路了，永远到不了 execpolicy —— 拆解表要求的
