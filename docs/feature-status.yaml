  # W6/Task 1：八个 agent_* 的 DefaultTimeout 全为 0，而 WithTimeout(ctx,0) 给的是
  # 已过期 context —— 工具第一行就失败，且 GuardedTool 把失败当**工具结果**回喂模型，
  # 于是模型重试、再失败，不崩不报只烧 token。NewGuardedTool 现在构造期 panic，
  # 无界必须显式写 NoTimeout（Stream 里单独分支，因为 WithTimeout 对任何非正数都
  # 当场过期，换个常量值解决不了问题）。装配侧由 App.ToolTimeouts +
  # internal/bootstrap::TestNoRegisteredToolHasAZeroTimeout 二次把关。
  # 2026-08-07：partial → done。五条子句逐条补齐，每条的变异探针都验过。
  #   1 注册表的静态类型是 []orchestrator.BaseTool（Eino 的 InvokableTool 别名），
  #     只要 Info+InvokableRun —— 编译期从不要求成员满足 yanshi 自己的 Tool 契约。
  #     快照循环原先用结构化断言 interface{ DefaultTimeout() ... } 探一个方法，
  #     换成具名的 tools.Tool（三方法一起），ToolTimeouts 于是成为「谁完整履约」的
  #     记录。DisplayName 那半改在构造期 panic 而不是事后清点 —— 让它不可表达，
  #     而不只是今天恰好为空的没有。
  #   2 SyncStream 把 Text 与 Result 设成同一个字符串，所以一个也拼接 Text 的
  #     InvokableRun 不会让树里任何测试变红。探针给每个字段不同的值。
  #   4 第一版自己推 chunk，证的是 GuardedTool 转发字段（那是子句 2）。改成驱动
  #     真实的 agent_start：runner 扮演 orchestrator 发 SubAgentEvent，被测的是
