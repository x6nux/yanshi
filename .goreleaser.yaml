# goreleaser v2 config for yanshi. Four targets, all CGO_ENABLED=0 + nokeyring
# (keyring variant deferred past v1; see docs/superpowers/specs/...h1...md §5).
# Version is injected via ldflags (version.Version is a var since VER1).
# bubbletea fork resolves via go.mod replace => ./third_party/bubbletea (tracked).
version: 2

project_name: yanshi

before:
  hooks:
    - go mod tidy

builds:
  - id: yanshi
    main: ./cmd/yanshi
    binary: yanshi
    env:
      - CGO_ENABLED=0
    flags:
      - -tags=nokeyring
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/x6nux/yanshi/internal/version.Version={{.Version}}
      - -X github.com/x6nux/yanshi/internal/version.BuildStamp={{.Date}}
    goos: [linux, windows, darwin]
    goarch: [amd64, arm64]
    # Ship exactly four targets: windows/amd64, linux/amd64, linux/arm64, darwin/arm64.
    ignore:
      - goos: windows
        goarch: arm64
      - goos: darwin
        goarch: amd64

archives:
  - id: default
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_
      {{- if eq .Os "darwin" }}macos{{ else }}{{ .Os }}{{ end }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - config.example.yaml
      - src: README.md
        dst: README.md
      # LICENSE ships in the archive because MIT requires the notice to travel
      # with every copy — a binary downloaded from a release IS a copy.
      - src: LICENSE
        dst: LICENSE

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-dev"

# No `changelog:` block on purpose. git-cliff owns the release notes
# (release.yml feeds them via --release-notes RELEASE_NOTES.md) and the
# changelog pipe loads ReleaseNotesFile on its first lines, then returns early
# — so the built-in changelog never runs and there is no dupe to suppress.
#
# Do NOT "disable" the pipe to express that: the disable check lives in the
# pipe's Skip(), not its Run(), so disabling it also skips the --release-notes
# load and ships an EMPTY release body. (The older `changelog.skip` key was
# removed outright in goreleaser v2.0 — with version: 2 and UnmarshalStrict it
# is a hard parse error, not a warning.)

release:
  draft: false
  prerelease: auto
  name_template: "v{{.Version}}"
